# Nginx configuration for React Dashboard (SPA)

server {
    listen 80;
    server_name dashboard.example.com;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Favicon - serve with correct MIME type
    location = /favicon.svg {
        add_header Content-Type image/svg+xml;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /favicon.ico {
        # Serve SVG favicon for .ico requests (modern browsers accept this)
        try_files /favicon.svg =404;
        add_header Content-Type image/svg+xml;
    }

    # SVG files (logos, icons) - need explicit MIME type
    location ~* \.svg$ {
        add_header Content-Type image/svg+xml;
        add_header Cache-Control "public, max-age=86400";
    }

    # PNG files (PDF report logo)
    location ~* \.png$ {
        add_header Content-Type image/png;
        add_header Cache-Control "public, max-age=86400";
    }

    # Cache JS/CSS assets (immutable - hash in filename)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - serve index.html for all routes not matching files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

