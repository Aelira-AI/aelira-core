version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    # These transitive pins must follow their parent package's metadata.
    # See docs/DEPENDENCIES.md before changing either compatible pair.
    ignore:
      - dependency-name: "pydantic-core"
      - dependency-name: "mpmath"
        versions: [">=1.4"]
      # Held pending security and integrity reviews; remove each entry when
      # its review closes. Tracked in issue #755 and the consumer fixture
      # integrity baseline (issue #984).
      # PyMuPDF: CVE-2026-112036 fix is not in any MuPDF release PyMuPDF
      # ships; MuPDF 1.28.6 lacks the fix commit (issue #755).
      - dependency-name: "PyMuPDF"
      # Version-coupled to PyMuPDF, held for the same issue #755 finding.
      - dependency-name: "pymupdf-layout"
      - dependency-name: "pymupdf4llm"
      # Held by the consumer fixture integrity baseline pending separate
      # review.
      - dependency-name: "SQLAlchemy"
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/cli"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      cli-npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      dashboard-npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    # Pa11y's runtime contract uses Node 24 LTS. Review major migrations
    # explicitly while continuing patch and digest updates within that line.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
