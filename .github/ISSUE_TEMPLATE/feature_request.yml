name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Early-stage or open-ended ideas are better started in
        [Ideas Discussions](https://github.com/Aelira-AI/aelira-core/discussions/categories/ideas) —
        confirmed, scoped work graduates to an issue like this one.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, screenshots, or references.
