# Reusable publish gate: require a successful CI workflow run for the exact
# tagged SHA, from a push to the repository's default branch.

name: CI gate

on:
  workflow_call:

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  wait-for-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require successful CI push run on published SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 1800 ))
          DEFAULT_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          export DEFAULT_BRANCH
          echo "Gating release on CI push run for $GITHUB_SHA on $DEFAULT_BRANCH"
          while true; do
            RUN=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=$DEFAULT_BRANCH&head_sha=$GITHUB_SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .event == "push" and .head_branch == env.DEFAULT_BRANCH)] | sort_by(.run_attempt, .created_at) | last // {}' \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --method GET)
            STATUS=$(jq -r '.status // "missing"' <<<"$RUN")
            CONCLUSION=$(jq -r '.conclusion // "pending"' <<<"$RUN")
            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
              echo "Exact CI workflow run is green"
              exit 0
            fi
            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" != "success" ]; then
              echo "Refusing release: CI concluded $CONCLUSION for $GITHUB_SHA" >&2
              exit 1
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Timed out waiting for exact CI push run on $DEFAULT_BRANCH at $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Waiting for CI (status=$STATUS conclusion=$CONCLUSION)"
            sleep 30
          done
