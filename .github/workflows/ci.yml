name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes any still-running CI for the same ref — saves
# Actions minutes and keeps the queue honest during rapid iteration.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: Shipped dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install Python audit build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config
      - name: Validate Trivy exemption governance
        run: python scripts/verify_trivy_allowlist.py .trivyignore
      - name: Audit Python runtime dependencies
        run: |
          python -m pip install 'pip-audit==2.10.0'
          pip-audit --requirement requirements.txt --strict
          pip-audit --requirement requirements-dev.txt --strict
      - name: Audit shipped npm surfaces
        run: |
          npm --prefix cli audit --audit-level=high
          npm --prefix dashboard audit --audit-level=high
      - name: Review pull-request dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install linters
        run: pip install "ruff==0.16.5" "black==26.5.1"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: black --check src/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aelira
          POSTGRES_PASSWORD: aelira
          POSTGRES_DB: aelira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install system dependencies
        # cairo/pkg-config: pycairo builds from source; OCRmyPDF uses
        # unpaper/Ghostscript and its fallback uses Poppler/Tesseract.
        # ffmpeg: multimedia tests
        run: |
          timeout 5m sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
          timeout 5m sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install -y libcairo2-dev pkg-config \
            tesseract-ocr tesseract-ocr-eng unpaper ghostscript poppler-utils ffmpeg
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install pinned equation-verifier browser
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        env:
          DATABASE_URL: postgresql://aelira:aelira@localhost:5432/aelira_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-for-ci
          ENV: test
        run: pytest tests/ -v --tb=short
      - name: Required PDF remediation acceptance corpus
        env:
          DATABASE_URL: postgresql://aelira:aelira@localhost:5432/aelira_test
          JWT_SECRET: test-secret-for-ci
          ENV: test
        run: python scripts/pdf_acceptance_corpus.py --manifest tests/fixtures/pdf_acceptance/manifest.json
      - name: Create isolated worker test database
        env:
          PGPASSWORD: aelira
        run: createdb --host=localhost --username=aelira worker_isolation_test
      - name: Run PostgreSQL worker-isolation tests
        env:
          DATABASE_URL: postgresql://aelira:aelira@localhost:5432/worker_isolation_test
          TEST_MIGRATION_DATABASE_URL: postgresql://aelira:aelira@localhost:5432/worker_isolation_test
          ALLOW_DESTRUCTIVE_MIGRATION_TESTS: "1"
          REQUIRE_WORKER_POSTGRES_TESTS: "1"
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-for-ci
          ENV: test
        run: pytest tests/test_durable_job_processor_postgres.py -v --tb=short --no-cov

  document-stack:
    name: Real document queue and artifact acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: aelira
          POSTGRES_PASSWORD: aelira
          POSTGRES_DB: document_acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '18325:8025']
    env:
      ENV: development
      DEBUG: 'false'
      ALLOW_MOCK_AUTH: 'false'
      DATABASE_URL: postgresql://aelira:aelira@localhost:5432/document_acceptance
      REDIS_URL: redis://localhost:6379/0
      LLM_PROVIDER: none
      LLM_FALLBACK_PROVIDER: none
      EMBEDDING_PROVIDER: none
      OPEN_SIGNUP: 'false'
      DEFAULT_DEPARTMENT_TIER: department
      PUBLIC_API_URL: http://localhost:18300
      PUBLIC_DASHBOARD_URL: http://localhost:15373
      PUBLIC_WEBSITE_URL: http://localhost:15373
      MAGIC_LINK_BASE_URL: http://localhost:15373
      CORS_ORIGINS: http://localhost:15373
      SESSION_COOKIE_SECURE: 'false'
      CSRF_COOKIE_SECURE: 'false'
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      FROM_EMAIL: noreply@example.org
      MARKETING_EMAIL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install document runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config tesseract-ocr ghostscript poppler-utils unzip
          pip install -r requirements-dev.txt
      - name: Verify real API, durable worker and downloaded files
        run: |
          set -euo pipefail
          export JWT_SECRET="$(openssl rand -hex 48)"
          export TOKEN_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export REMEDIATION_ARTIFACT_DIR="$RUNNER_TEMP/document-artifacts"
          alembic upgrade head
          uvicorn src.api.main:app --host 127.0.0.1 --port 18300 --no-proxy-headers > "$RUNNER_TEMP/document-api.log" 2>&1 &
          api_pid=$!
          python -m src.jobs.worker > "$RUNNER_TEMP/document-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$api_pid" "$worker_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl -fsS http://localhost:18300/ready >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          node --experimental-strip-types scripts/verify_document_stack.ts

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 22+: the unit tests import .ts files directly and rely on
          # Node's native type stripping (unavailable on Node 20)
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  e2e-release:
    name: Deterministic Chromium release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Install deterministic release browser
        run: npx playwright install --with-deps chromium
      - name: Run release smoke
        run: npm run test:e2e:release

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Deliberately the CLI's supported floor (engines >=22).
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install CLI browser
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  docker:
    name: Docker (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify production Compose environment contract
        if: matrix.platform == 'linux/amd64'
        run: scripts/check-production-compose.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and verify reproducible API image
        run: scripts/verify_reproducible_image.sh . Dockerfile ${{ matrix.platform }}
      - name: Load API image for kernel worker-isolation gate
        if: matrix.platform == 'linux/amd64'
        run: docker buildx build --load --tag aelira-worker-isolation:test --file Dockerfile .
      - name: Enforce 0.75-CPU worker isolation under representative saturation
        if: matrix.platform == 'linux/amd64'
        run: python3 scripts/verify_worker_cpu_isolation.py --image aelira-worker-isolation:test
      - name: Build and verify reproducible dashboard image
        run: scripts/verify_reproducible_image.sh dashboard dashboard/Dockerfile ${{ matrix.platform }}
