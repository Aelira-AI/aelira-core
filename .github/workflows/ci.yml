name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes any still-running CI for the same ref — saves
# Actions minutes and keeps the queue honest during rapid iteration.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-complete:
    name: CI complete
    if: always()
    needs:
      - expat-native-acceptance
      - cjson-native-package
      - xrender-native-package
      - xdg-native-package
      - tiff-native-package
      - python-native-components
      - lxml-native-component
      - latexml-native-component
      - configuration-smoke
      - dev-setup-tests
      - dependency-security
      - lint
      - test
      - document-stack
      - dashboard
      - e2e-release
      - cli
      - quickstart
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$JOB_RESULTS" | jq -e '
            length == 19 and all(.[]; .result == "success")
          '

  expat-native-acceptance:
    name: Native Expat acceptance (${{ matrix.arch }})
    permissions:
      contents: read
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate source, repeat offline native builds, and probe installed package
        env:
          AELIRA_EXPAT_EXPECT_ARCH: ${{ matrix.arch }}
          AELIRA_EXPAT_OUTPUT: ${{ runner.temp }}/expat-native-acceptance
        run: |
          mkdir -p "$AELIRA_EXPAT_OUTPUT"
          bash runtime-security/expat/native-acceptance.sh
      - name: Record native Docker storage identity
        if: always()
        env:
          AELIRA_EXPAT_OUTPUT: ${{ runner.temp }}/expat-native-acceptance
        run: |
          mkdir -p "$AELIRA_EXPAT_OUTPUT"
          docker version --format '{{json .Server.Version}}' > "$AELIRA_EXPAT_OUTPUT/docker-version.json"
          docker info --format '{{json .Driver}}' > "$AELIRA_EXPAT_OUTPUT/docker-storage-driver.json"
          docker info --format '{{json .DriverStatus}}' > "$AELIRA_EXPAT_OUTPUT/docker-storage-status.json"
      - name: Record source identity for native evidence
        if: always()
        env:
          AELIRA_EXPAT_OUTPUT: ${{ runner.temp }}/expat-native-acceptance
        run: |
          mkdir -p "$AELIRA_EXPAT_OUTPUT"
          git rev-parse HEAD > "$AELIRA_EXPAT_OUTPUT/source-revision.txt"
          git ls-files -z runtime-security/expat .github/workflows/ci.yml |
            xargs -0 sha256sum > "$AELIRA_EXPAT_OUTPUT/source-files.sha256"
      - name: Retain native source, build, and installed-consumer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expat-native-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/expat-native-acceptance/provenance/
            ${{ runner.temp }}/expat-native-acceptance/source-input/*.dsc
            ${{ runner.temp }}/expat-native-acceptance/source-input/*.orig.tar.gz
            ${{ runner.temp }}/expat-native-acceptance/source-input/*.debian.tar.xz
            ${{ runner.temp }}/expat-native-acceptance/build-*/*.log
            ${{ runner.temp }}/expat-native-acceptance/build-*/output-sha256.txt
            ${{ runner.temp }}/expat-native-acceptance/build-*/*.dsc
            ${{ runner.temp }}/expat-native-acceptance/build-*/*.debian.tar.xz
            ${{ runner.temp }}/expat-native-acceptance/build-*/libexpat1_*.deb
            ${{ runner.temp }}/expat-native-acceptance/*.txt
            ${{ runner.temp }}/expat-native-acceptance/*.json
            ${{ runner.temp }}/expat-native-acceptance/*.log
            ${{ runner.temp }}/expat-native-acceptance/source-files.sha256
          if-no-files-found: error
          retention-days: 14

  cjson-native-package:
    name: cJSON native package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test native cJSON packages
        id: build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain -- runtime-security/cjson)"
          set +e
          AELIRA_CJSON_EXPECT_ARCH="${{ matrix.arch }}" AELIRA_CJSON_SAVE_BUILDER=1 \
            bash runtime-security/cjson/build.sh "$RUNNER_TEMP/cjson-native-output" \
            > "$RUNNER_TEMP/cjson-native-private.log" 2>&1
          result=$?
          if test "$result" = 0; then
            python3 -B runtime-security/cjson/test-evidence.py \
              --source "$RUNNER_TEMP/cjson-native-output" --repo "$GITHUB_WORKSPACE" \
              --scratch "$RUNNER_TEMP/cjson-evidence-controls" --arch "${{ matrix.arch }}"
            result=$?
          fi
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/cjson-native-exit.txt"
          if test -f "$RUNNER_TEMP/cjson-native-output/build-status.json"; then
            cat "$RUNNER_TEMP/cjson-native-output/build-status.json"
          fi
          exit "$result"
      - name: Export cJSON component evidence
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          result=125
          if test -f "$RUNNER_TEMP/cjson-native-exit.txt"; then
            read -r result < "$RUNNER_TEMP/cjson-native-exit.txt"
          fi
          python3 -B runtime-security/cjson/collect-evidence.py \
            --source "$RUNNER_TEMP/cjson-native-output" \
            --dest "$RUNNER_TEMP/cjson-native-evidence" \
            --repo "$GITHUB_WORKSPACE" --arch "${{ matrix.arch }}" \
            --revision "$GITHUB_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" \
            --build-exit "$result" --require-builder
      - name: Upload cJSON component evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cjson-native-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cjson-native-evidence/
          if-no-files-found: error
          retention-days: 14

  xrender-native-package:
    name: Xrender native package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test native Xrender packages
        id: build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain -- runtime-security/xrender)"
          set +e
          AELIRA_XRENDER_EXPECT_ARCH="${{ matrix.arch }}" AELIRA_XRENDER_SAVE_BUILDER=1 \
            bash runtime-security/xrender/build.sh "$RUNNER_TEMP/xrender-native-output" \
            > "$RUNNER_TEMP/xrender-native-private.log" 2>&1
          result=$?
          if test "$result" = 0; then
            python3 -B runtime-security/xrender/test-ci-evidence.py \
              --source "$RUNNER_TEMP/xrender-native-output" --repo "$GITHUB_WORKSPACE" \
              --scratch "$RUNNER_TEMP/xrender-evidence-controls" --arch "${{ matrix.arch }}"
            result=$?
          fi
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/xrender-native-exit.txt"
          if test -f "$RUNNER_TEMP/xrender-native-output/build-status.json"; then
            cat "$RUNNER_TEMP/xrender-native-output/build-status.json"
          fi
          exit "$result"
      - name: Export Xrender component evidence
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          result=125
          if test -f "$RUNNER_TEMP/xrender-native-exit.txt"; then
            read -r result < "$RUNNER_TEMP/xrender-native-exit.txt"
          fi
          python3 -B runtime-security/xrender/ci-evidence.py \
            --source "$RUNNER_TEMP/xrender-native-output" \
            --dest "$RUNNER_TEMP/xrender-native-evidence" \
            --repo "$GITHUB_WORKSPACE" --arch "${{ matrix.arch }}" \
            --revision "$GITHUB_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" \
            --build-exit "$result"
      - name: Upload Xrender component evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xrender-native-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xrender-native-evidence/
          if-no-files-found: error
          retention-days: 14

  xdg-native-package:
    name: xdg native package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Build xdg packages and test the installed native client
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain -- runtime-security/xdg .github/workflows/ci.yml)"
          set +e
          AELIRA_XDG_EXPECT_ARCH="${{ matrix.arch }}" \
            bash runtime-security/xdg/build.sh "$RUNNER_TEMP/xdg-native-output" \
            > "$RUNNER_TEMP/xdg-native-private.log" 2>&1
          result=$?
          if test "$result" = 0; then
            bun runtime-security/xdg/test-ci-evidence.ts \
              --source "$RUNNER_TEMP/xdg-native-output" --repo "$GITHUB_WORKSPACE" \
              --scratch "$RUNNER_TEMP/xdg-export-controls" \
              --dest "$RUNNER_TEMP/xdg-native-evidence" --arch "${{ matrix.arch }}" \
              > "$RUNNER_TEMP/xdg-export-controls-private.log" 2>&1
            result=$?
          fi
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/xdg-native-exit.txt"
          if test -f "$RUNNER_TEMP/xdg-native-output/build-status.json"; then
            cat "$RUNNER_TEMP/xdg-native-output/build-status.json"
          fi
          exit "$result"
      - name: Require complete xdg evidence or record the failure
        if: always() && steps.checkout.outcome == 'success' && steps.bun.outcome == 'success'
        shell: bash
        run: |
          result=125
          if test -f "$RUNNER_TEMP/xdg-native-exit.txt"; then
            read -r result < "$RUNNER_TEMP/xdg-native-exit.txt"
          fi
          if test -f "$RUNNER_TEMP/xdg-native-evidence/component.json"; then
            AELIRA_XDG_CI_EXIT="$result" bun runtime-security/xdg/verify-export.ts \
              --source "$RUNNER_TEMP/xdg-native-evidence" --repo "$GITHUB_WORKSPACE" \
              --arch "${{ matrix.arch }}" --revision "$GITHUB_SHA" \
              --tree "$(git rev-parse 'HEAD^{tree}')"
          else
            bun runtime-security/xdg/ci-evidence.ts \
              --source "$RUNNER_TEMP/xdg-native-output" --dest "$RUNNER_TEMP/xdg-native-evidence" \
              --repo "$GITHUB_WORKSPACE" --arch "${{ matrix.arch }}" \
              --revision "$GITHUB_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" \
              --build-exit "$result"
          fi
      - name: Upload xdg component evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xdg-native-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xdg-native-evidence/
          if-no-files-found: error
          retention-days: 14

  tiff-native-package:
    name: TIFF native package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test native TIFF packages
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tiff-native-output"
          python3 runtime-security/media/tiff/test-ci-evidence.py
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain -- runtime-security/media/tiff)"
          set +e
          AELIRA_TIFF_EXPECT_ARCH="${{ matrix.arch }}" AELIRA_TIFF_SAVE_BUILDER=0 \
            bash runtime-security/media/tiff/build.sh "$RUNNER_TEMP/tiff-native-output" \
            > "$RUNNER_TEMP/tiff-native-build-console.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/tiff-native-build-console.log"
          printf '%s\n' "$result" > "$RUNNER_TEMP/tiff-native-build-exit.txt"
          exit "$result"
      - name: Export bounded TIFF evidence
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          result=125
          if test -f "$RUNNER_TEMP/tiff-native-build-exit.txt"; then
            read -r result < "$RUNNER_TEMP/tiff-native-build-exit.txt"
          fi
          python3 runtime-security/media/tiff/ci-evidence.py \
            --source "$RUNNER_TEMP/tiff-native-output" \
            --dest "$RUNNER_TEMP/tiff-native-evidence" \
            --repo "$GITHUB_WORKSPACE" \
            --arch "${{ matrix.arch }}" \
            --revision "$GITHUB_SHA" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --build-exit "$result"
      - name: Upload bounded TIFF evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tiff-native-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tiff-native-evidence/
          if-no-files-found: error
          retention-days: 14

  python-native-components:
    name: Native Python component consumers (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            tiff_artifact_id: 11711217496
          - arch: arm64
            runner: ubuntu-24.04-arm
            tiff_artifact_id: 11711427167
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native proof verification utilities
        id: utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils gpgv
      - name: Fetch the accepted native TIFF artifact
        id: tiff
        env:
          GH_TOKEN: ${{ github.token }}
          TIFF_ARTIFACT_ID: ${{ matrix.tiff_artifact_id }}
        run: |
          set -euo pipefail
          gh api "repos/Aelira-AI/aelira-core/actions/artifacts/$TIFF_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/python-native-tiff.zip"
      - name: Check native evidence control tests
        id: controls
        run: |
          python3 -B runtime-security/media/pillow/test-ci-evidence.py
          python3 -B runtime-security/psycopg2/test-ci-evidence.py
          python3 -B runtime-security/python-native-ci/test-run.py
      - name: Build and verify both native Python components
        id: components
        shell: bash
        env:
          AELIRA_NATIVE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(/usr/bin/git status --porcelain)"
          set +e
          python3 runtime-security/python-native-ci/run.py \
            --repo "$GITHUB_WORKSPACE" --arch "$AELIRA_NATIVE_ARCH" \
            --expected-ref "$GITHUB_SHA" \
            --scratch "$RUNNER_TEMP/python-native-private" \
            --tiff-zip "$RUNNER_TEMP/python-native-tiff.zip" \
            --dest "$RUNNER_TEMP/python-native-evidence" \
            > "$RUNNER_TEMP/python-native-runner.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/python-native-runner-exit.txt"
          printf 'exit_code=%s\n' "$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Retain bounded workflow outcomes
        if: always() && steps.checkout.outcome == 'success'
        env:
          AELIRA_NATIVE_ARCH: ${{ matrix.arch }}
          UTILITIES_OUTCOME: ${{ steps.utilities.outcome }}
          CONTROLS_OUTCOME: ${{ steps.controls.outcome }}
          TIFF_OUTCOME: ${{ steps.tiff.outcome }}
          COMPONENT_OUTCOME: ${{ steps.components.outcome }}
          COMPONENT_EXIT: ${{ steps.components.outputs.exit_code }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          arch = os.environ['AELIRA_NATIVE_ARCH']
          assert arch in {'amd64', 'arm64'}
          revision = os.environ['GITHUB_SHA']
          assert re.fullmatch('[0-9a-f]{40}', revision)
          outcomes = {name: os.environ[name] or 'not_reported'
                      for name in ('UTILITIES_OUTCOME', 'TIFF_OUTCOME', 'CONTROLS_OUTCOME', 'COMPONENT_OUTCOME')}
          assert all(value in {'success', 'failure', 'cancelled', 'skipped', 'not_reported'}
                     for value in outcomes.values())
          raw_exit = os.environ['COMPONENT_EXIT']
          observed_exit = int(raw_exit) if raw_exit and re.fullmatch('[0-9]{1,3}', raw_exit) else None
          assert observed_exit is None or 0 <= observed_exit <= 255
          destination = Path(os.environ['RUNNER_TEMP']) / 'python-native-evidence'
          destination.mkdir(exist_ok=True)
          (destination / 'workflow-outcomes.json').write_text(json.dumps({
              'architecture': arch, 'revision': revision,
              'workflow_outcomes': outcomes, 'runner_observed_exit': observed_exit,
              'complete': all(value == 'success' for value in outcomes.values()) and observed_exit == 0,
          }, sort_keys=True, indent=2) + '\n')
          if outcomes['COMPONENT_OUTCOME'] == 'success' and observed_exit != 0:
              raise SystemExit(1)
          PY
      - name: Upload only bounded native Python evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-native-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-native-evidence/
          if-no-files-found: error
          retention-days: 14

  lxml-native-component:
    name: Native lxml component consumers (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native proof verification utilities
        id: utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils gpgv
      - name: Check native XML evidence controls
        id: controls
        run: |
          python3 -B runtime-security/lxml-native-ci/test-evidence.py
          python3 -B runtime-security/lxml-native-ci/test-run.py
      - name: Build and verify the native XML component
        id: component
        shell: bash
        env:
          AELIRA_NATIVE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(/usr/bin/git status --porcelain)"
          expected_tree=$(/usr/bin/git rev-parse HEAD^{tree})
          set +e
          python3 -I runtime-security/lxml-native-ci/run.py \
            --repo "$GITHUB_WORKSPACE" --arch "$AELIRA_NATIVE_ARCH" \
            --expected-ref "$GITHUB_SHA" --expected-tree "$expected_tree" \
            --scratch "$RUNNER_TEMP/lxml-native-private" \
            --dest "$RUNNER_TEMP/lxml-native-evidence" \
            > "$RUNNER_TEMP/lxml-native-runner.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/lxml-native-runner-exit.txt"
          printf 'exit_code=%s\n' "$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Retain bounded workflow outcomes
        if: always() && steps.checkout.outcome == 'success'
        env:
          AELIRA_NATIVE_ARCH: ${{ matrix.arch }}
          UTILITIES_OUTCOME: ${{ steps.utilities.outcome }}
          CONTROLS_OUTCOME: ${{ steps.controls.outcome }}
          COMPONENT_OUTCOME: ${{ steps.component.outcome }}
          COMPONENT_EXIT: ${{ steps.component.outputs.exit_code }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          arch = os.environ['AELIRA_NATIVE_ARCH']
          assert arch in {'amd64', 'arm64'}
          revision = os.environ['GITHUB_SHA']
          assert re.fullmatch('[0-9a-f]{40}', revision)
          outcomes = {name: os.environ[name] or 'not_reported'
                      for name in ('UTILITIES_OUTCOME', 'CONTROLS_OUTCOME', 'COMPONENT_OUTCOME')}
          assert all(value in {'success', 'failure', 'cancelled', 'skipped', 'not_reported'}
                     for value in outcomes.values())
          raw_exit = os.environ['COMPONENT_EXIT']
          observed_exit = int(raw_exit) if raw_exit and re.fullmatch('[0-9]{1,3}', raw_exit) else None
          assert observed_exit is None or 0 <= observed_exit <= 255
          destination = Path(os.environ['RUNNER_TEMP']) / 'lxml-native-evidence'
          destination.mkdir(exist_ok=True)
          (destination / 'workflow-outcomes.json').write_text(json.dumps({
              'architecture': arch, 'revision': revision,
              'workflow_outcomes': outcomes, 'runner_observed_exit': observed_exit,
              'complete': all(value == 'success' for value in outcomes.values()) and observed_exit == 0,
          }, sort_keys=True, indent=2) + '\n')
          if outcomes['COMPONENT_OUTCOME'] == 'success' and observed_exit != 0:
              raise SystemExit(1)
          PY
      - name: Upload only bounded native XML evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lxml-native-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lxml-native-evidence/
          if-no-files-found: error
          retention-days: 14


  latexml-native-component:
    name: Native LaTeXML source component (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AELIRA_SOURCE_KIND: public
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install native proof utilities
        id: utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils gpgv
      - name: Bind the actual checkout and check portable controls
        id: controls
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Aelira-AI/aelira-core"
          test "$(/usr/bin/git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(/usr/bin/git status --porcelain)"
          origin=$(/usr/bin/git remote get-url origin)
          case "$origin" in
            https://github.com/Aelira-AI/aelira-core|https://github.com/Aelira-AI/aelira-core.git) ;;
            *) exit 1 ;;
          esac
          /usr/bin/git remote set-url origin https://github.com/Aelira-AI/aelira-core.git
          expected_tree=$(/usr/bin/git rev-parse HEAD^{tree})
          python3 -B runtime-security/latexml-native-ci/test-run.py \
            --operator-repo "$GITHUB_WORKSPACE" --operator-ref "$GITHUB_SHA" \
            --operator-tree "$expected_tree" \
            --scratch "$RUNNER_TEMP/latexml-native-portable-controls" --native-cleanup
          bun runtime-security/latexml-native-ci/test-capture-retry.ts
      - name: Build and verify the native LaTeXML component
        id: component
        shell: bash
        env:
          AELIRA_NATIVE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/latexml-official-source"
          /usr/bin/git clone --no-checkout https://github.com/brucemiller/LaTeXML.git "$upstream" \
            > "$RUNNER_TEMP/latexml-upstream-private.log" 2>&1
          /usr/bin/git -C "$upstream" checkout --detach 0db6f47ea859391f9099e6e25e7405afad8467bf \
            >> "$RUNNER_TEMP/latexml-upstream-private.log" 2>&1
          test "$(/usr/bin/git -C "$upstream" rev-parse HEAD)" = 0db6f47ea859391f9099e6e25e7405afad8467bf
          test "$(/usr/bin/git -C "$upstream" rev-parse HEAD^{tree})" = 2693c0c65c86f6b36370af18496d8283cf4f73ea
          expected_tree=$(/usr/bin/git rev-parse HEAD^{tree})
          set +e
          bun runtime-security/latexml-native-ci/capture-retry.ts \
            --operator-repo "$GITHUB_WORKSPACE" --operator-ref "$GITHUB_SHA" \
            --operator-tree "$expected_tree" --source-kind public --remote-ref "$GITHUB_REF" \
            --architecture "$AELIRA_NATIVE_ARCH" --upstream-repo "$upstream" \
            --scratch "$RUNNER_TEMP/latexml-native-private" \
            --out "$RUNNER_TEMP/latexml-native-validated" --capture-input \
            > "$RUNNER_TEMP/latexml-native-runner.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" >> "$RUNNER_TEMP/latexml-native-runner-exit.txt"
          printf 'exit_code=%s\n' "$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Retain safe workflow and final native outcomes
        if: always() && steps.checkout.outcome == 'success'
        env:
          AELIRA_NATIVE_ARCH: ${{ matrix.arch }}
          UTILITIES_OUTCOME: ${{ steps.utilities.outcome }}
          CONTROLS_OUTCOME: ${{ steps.controls.outcome }}
          COMPONENT_OUTCOME: ${{ steps.component.outcome }}
          COMPONENT_EXIT: ${{ steps.component.outputs.exit_code }}
        run: |
          python3 -B - <<'PY'
          import sys


          def main():
              import argparse
              import hashlib
              import json
              import os
              from pathlib import Path
              import re
              import subprocess
              import stat
              import sys

              sys.dont_write_bytecode = True
              os.umask(0o022)
              arch = os.environ["AELIRA_NATIVE_ARCH"]
              revision = os.environ["GITHUB_SHA"]
              tree = subprocess.check_output(
                  ["/usr/bin/git", "rev-parse", "HEAD^{tree}"], text=True).strip()
              kind = os.environ["AELIRA_SOURCE_KIND"]
              remote = os.environ["GITHUB_REF"] if kind == "public" else None
              assert arch in {"amd64", "arm64"} and kind in {"public", "synthetic"}
              assert re.fullmatch("[0-9a-f]{40}", revision)
              assert re.fullmatch("[0-9a-f]{40}", tree)
              repo = Path(os.environ["GITHUB_WORKSPACE"])
              a = argparse.Namespace(operator_repo=repo, operator_ref=revision,
                                     operator_tree=tree, source_kind=kind, remote_ref=remote,
                                     architecture=arch)
              # Authenticate every fixed selected Git source before importing candidate code.
              assert repo.is_absolute() and repo.resolve(strict=True) == repo
              def git(*args):
                  return subprocess.check_output(["/usr/bin/git", "-C", str(repo), *args])
              assert git("rev-parse", "HEAD").decode().strip() == revision
              assert git("rev-parse", "--show-toplevel").decode().strip() == str(repo)
              assert git("remote", "get-url", "origin").decode().strip() == (
                  "https://github.com/Aelira-AI/aelira-core.git")
              assert not git("status", "--porcelain")
              names = (
                  "runtime-security/latexml-native-acceptance/README.md",
                  "runtime-security/latexml-native-acceptance/bootstrap.py",
                  "runtime-security/latexml-native-acceptance/native_acceptance.py",
                  "runtime-security/latexml-native-ci/README.md",
                  "runtime-security/latexml-native-ci/run.py",
                  "runtime-security/latexml-native-ci/evidence.py",
                  "runtime-security/latexml-native-ci/test-run.py",
                  "runtime-security/latexml/Dockerfile.probe",
                  "runtime-security/latexml/README.md",
                  "runtime-security/latexml/accept_image.py",
                  "runtime-security/latexml/package_source.py",
                  "runtime-security/latexml/prepare-source.sh",
                  "runtime-security/latexml/probe_cases.py",
                  "runtime-security/latexml/probe_integrated.py",
                  "runtime-security/latexml/siunitx-v3-adapter.patch",
                  "runtime-security/latexml/siunitx.sty.ltxml",
                  "runtime-security/latexml/verify_install.py",
              )
              selected_git = {}
              for name in names:
                  entries = git("ls-tree", "-z", revision, "--", name).split(b"\0")
                  assert len(entries) == 2 and entries[1] == b""
                  header, separator, relative = entries[0].partition(b"\t")
                  tokens = header.split()
                  assert separator and relative.decode() == name
                  assert len(tokens) == 3 and tokens[:2] == [b"100644", b"blob"]
                  path = repo / name
                  assert path.resolve(strict=True) == path
                  with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW), "rb") as stream:
                      item = os.fstat(stream.fileno())
                      assert (stat.S_ISREG(item.st_mode) and item.st_nlink == 1 and
                              stat.S_IMODE(item.st_mode) == 0o644 and item.st_uid == os.getuid())
                      data = stream.read()
                  selected_git[name] = git("cat-file", "blob", tokens[2].decode())
                  assert data == selected_git[name]
              sys.path.insert(0, str(repo / "runtime-security/latexml-native-ci"))
              import run as common
              selected = common.selected(a)
              assert selected == selected_git
              caller = common.load_module(
                  repo / "runtime-security/latexml-native-acceptance/native_acceptance.py",
                  "footer_selected_caller")
              outcomes = {k: os.environ[k] or "not_reported" for k in (
                  "UTILITIES_OUTCOME", "CONTROLS_OUTCOME", "COMPONENT_OUTCOME")}
              assert all(v in {"success", "failure", "cancelled", "skipped", "not_reported"}
                         for v in outcomes.values())
              raw_exit = os.environ["COMPONENT_EXIT"]
              observed = int(raw_exit) if re.fullmatch("(?:0|[1-9][0-9]{0,2})", raw_exit) else None
              assert not raw_exit or observed is not None
              assert observed is None or 0 <= observed <= 255
              temp = Path(os.environ["RUNNER_TEMP"])
              destination = temp / "latexml-native-public-evidence"
              common.path_check(destination, new=True)
              destination.mkdir()
              receipt_status = "not_run" if outcomes["COMPONENT_OUTCOME"] in {
                  "skipped", "not_reported"} else "unavailable"
              outer = None
              bundle_copied = False
              validation = "not_run"
              pipeline_succeeded = all(v == "success" for v in outcomes.values())
              pipeline_passed = pipeline_succeeded and observed == 0
              try:
                  private_receipt = temp / "latexml-native-private/outer.json"
                  if private_receipt.exists():
                      row = common.read_json(private_receipt)
                      expected = common.identity(a)
                      assert type(row) is dict and set(row) == {
                          "schema", *expected, "stages", "captured_lock_sha256",
                          "selected_sources", "producer_status_sha256", "failure_diagnostic", "pending"}
                      assert row["schema"] == "aelira-latexml-ci-outer-v3"
                      assert all(row[k] == v for k, v in expected.items())
                      assert row["pending"] == [
                          "public_ci", "native_amd64", "full_application", "final_image",
                          "all_copy", "advisory", "R10", "#600", "#579", "#578"]
                      common.validate_stages(row["stages"])
                      for field in ("captured_lock_sha256", "producer_status_sha256"):
                          assert row[field] is None or (type(row[field]) is str and
                                                        re.fullmatch("[0-9a-f]{64}", row[field]))
                      if row["selected_sources"] is not None:
                          assert row["selected_sources"] == {
                              n: {"sha256": hashlib.sha256(data).hexdigest(),
                                  "size": len(data), "mode": 420}
                              for n, data in selected.items()}
                      # A record cannot supply its own source/input/bootstrap expectations.
                      private = temp / "latexml-native-private"
                      observed_lock = common.observe_capture_lock(private)
                      if row["captured_lock_sha256"] is not None:
                          assert row["captured_lock_sha256"] == observed_lock
                      diagnostic_expected = None
                      projection = row["failure_diagnostic"]
                      assert type(projection) is dict
                      if projection.get("state") == "valid":
                          assert outcomes["COMPONENT_OUTCOME"] == "failure" and observed == 2
                          assert row["selected_sources"] is not None
                          assert all(row["stages"][n] == {"state": "executed", "exit": 0}
                                     for n in common.STAGES[:6])
                          diagnostic_expected = common.diagnostic_expectations(
                              a, selected_git, observed_lock)
                          caller.validate_diagnostic_context(diagnostic_expected)
                          transport = private / "transport"
                          prepare = common.read_json(transport / "transport-receipt.json")
                          assert type(prepare) is dict and set(prepare) == {
                              "schema", "transport_sha256", "transport_size", "binding_sha256",
                              "runner_sha256", "source_kind", "operator_ref", "operator_tree"}
                          assert prepare["schema"] == "aelira-latexml-native-transport-v2"
                          assert prepare["source_kind"] == kind and prepare["operator_ref"] == revision
                          assert prepare["operator_tree"] == tree
                          assert (prepare["runner_sha256"] == diagnostic_expected["caller_sha256"] and
                                  prepare["binding_sha256"] == diagnostic_expected["binding_sha256"])
                          tar = common.regular(transport / "transport.tar")
                          assert type(prepare["transport_size"]) is int
                          assert prepare["transport_size"] == tar["size"]
                          assert prepare["transport_sha256"] == tar["sha256"]
                          assert common.regular(transport / "binding.json")["sha256"] == (
                              diagnostic_expected["binding_sha256"])
                          assert common.regular(private / "producer/source/binding.json")["sha256"] == (
                              diagnostic_expected["binding_sha256"])
                      caller.validate_failure_projection(
                          projection, diagnostic_expected, row["stages"]["native-run"])
                      if row["producer_status_sha256"] is not None:
                          assert common.regular(private / "producer/status.json")["sha256"] == (
                              row["producer_status_sha256"])
                      outer = row
                      receipt_status = "valid"
                      (destination / "final-outer.json").write_bytes(common.canonical(row))
                  if pipeline_passed:
                      assert outer is not None and receipt_status == "valid"
                      assert all(r == {"state": "executed", "exit": 0}
                                 for r in outer["stages"].values())
                      assert outer["selected_sources"] is not None
                      assert outer["captured_lock_sha256"] is not None
                      assert outer["producer_status_sha256"] is not None
                      bundle = temp / "latexml-native-validated"
                      manifest = common.read_json(bundle / "manifest.json", 500_000)
                      assert type(manifest) is dict and type(manifest.get("files")) is dict
                      digest = common.regular(bundle / "manifest.json")["sha256"]
                      check = subprocess.run(
                          [sys.executable, "-B", str(repo /
                           "runtime-security/latexml-native-ci/evidence.py"), "check",
                           "--evidence", str(bundle), "--verification-scratch",
                           str(temp / "latexml-native-footer-check"),
                           "--manifest-sha256", digest,
                           "--operator-repo", str(repo), "--operator-ref", revision,
                           "--operator-tree", tree, "--source-kind", kind,
                           "--architecture", arch] + (
                               ["--remote-ref", remote] if remote is not None else []),
                          capture_output=True, timeout=1800,
                          env={**os.environ, "PYTHONDONTWRITEBYTECODE": "1"})
                      (temp / "latexml-native-footer-private.log").write_bytes(
                          check.stdout + b"\n[stderr]\n" + check.stderr)
                      assert check.returncode == 0
                      files = set(manifest["files"]) | {"manifest.json"}
                      original = common.inventory(bundle, files)
                      assert {n: original[n] for n in manifest["files"]} == manifest["files"]
                      captured_digest = original["apt/input-lock.json"]["sha256"]
                      assert captured_digest == outer["captured_lock_sha256"]
                      bundled = common.read_json(bundle / "outer.json")
                      expected_bundled = json.loads(json.dumps(outer))
                      for stage in ("evidence-export", "evidence-check"):
                          expected_bundled["stages"][stage] = {"state": "not_run", "exit": None}
                      assert bundled == expected_bundled
                      component = temp / "latexml-native-footer-component-stage"
                      common.path_check(component, new=True)
                      component.mkdir()
                      for name in sorted(files):
                          target = component / name
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes((bundle / name).read_bytes())
                          target.chmod(original[name]["mode"])
                      assert common.inventory(component, files) == original
                      assert common.inventory(bundle, files) == original
                      public_component = destination / "component"
                      common.path_check(public_component, new=True)
                      component.rename(public_component)
                      bundle_copied = True
                      validation = "success"
              except (AssertionError, ValueError, OSError, KeyError, TypeError,
                      json.JSONDecodeError, subprocess.TimeoutExpired):
                  validation = "failure"
              complete = pipeline_passed and receipt_status == "valid" and bundle_copied
              status = {"architecture": arch, "revision": revision, "tree": tree,
                        "source_kind": kind, "workflow_outcomes": outcomes,
                        "runner_observed_exit": observed,
                        "final_receipt_status": receipt_status,
                        "footer_validation": validation, "complete": complete}
              (destination / "workflow-outcomes.json").write_bytes(common.canonical(status))
              if pipeline_succeeded and not complete:
                  raise SystemExit(1)


          if __name__ == "__main__":
              try:
                  main()
              except Exception:
                  print("bounded workflow outcomes refused", file=sys.stderr)
                  raise SystemExit(1)
          PY
          if test -f "$RUNNER_TEMP/latexml-capture-attempts.json"; then
            cp "$RUNNER_TEMP/latexml-capture-attempts.json" \
              "$RUNNER_TEMP/latexml-native-public-evidence/capture-attempts.json"
          fi
      - name: Upload only validated bounded LaTeXML evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latexml-native-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/latexml-native-public-evidence/
          if-no-files-found: error
          retention-days: 14

  configuration-smoke:
    name: Shipped configuration smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify Docker context exclusions and required inputs
        run: python scripts/verify_build_context.py
      - name: Verify API proxy routes against a disposable upstream
        run: python scripts/verify_nginx_api.py
      - name: Verify dashboard assets and proxy routing
        run: python scripts/verify_nginx_dashboard.py

  dev-setup-tests:
    name: Development setup orchestration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Check setup script and executable orchestration tests
        run: |
          bash -n setup-dev.sh
          jq --version
          node --experimental-strip-types --test scripts/dev_setup.test.ts

  dependency-security:
    name: Shipped dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Python audit build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config
      - name: Validate Trivy exemption governance
        run: python scripts/verify_trivy_allowlist.py .trivyignore
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Test complete image inventory gate
        run: bun test scripts/verify_trivy_inventory.test.ts
      - name: Test upgrade rehearsal isolation and receipt gates
        run: bun test scripts/upgrade_rehearsal.test.ts
      - name: Audit Python runtime dependencies
        run: |
          python -m pip install 'pip-audit==2.10.0'
          pip-audit --requirement requirements.txt --strict
          pip-audit --requirement requirements-dev.txt --strict
      - name: Audit shipped npm surfaces
        run: |
          npm --prefix cli audit --audit-level=high
          npm --prefix dashboard audit --audit-level=high
          npm --prefix pa11y-runtime audit --audit-level=high
      - name: Review pull-request dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install linters
        run: pip install "ruff==0.16.5" "black==26.5.1"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: black --check src/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      artifact-metadata: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aelira
          POSTGRES_PASSWORD: aelira
          POSTGRES_DB: aelira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install system dependencies
        # cairo/pkg-config: pycairo builds from source; OCRmyPDF uses
        # unpaper/Ghostscript and its fallback uses Poppler/Tesseract.
        # ffmpeg: multimedia tests; pandoc: actual siunitx fidelity controls.
        run: |
          timeout 5m sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
          timeout 5m sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install -y libcairo2-dev pkg-config \
            tesseract-ocr tesseract-ocr-eng unpaper ghostscript poppler-utils ffmpeg pandoc
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate release journey inventory
        run: >-
          python scripts/verify_release_journeys.py
          --revision "${{ github.sha }}"
          --output test-results/journey-matrix.json
      - name: Install pinned equation-verifier browser
        run: |
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              print(f"AELIRA_TEST_CHROMIUM_EXECUTABLE={playwright.chromium.executable_path}")
          PY
      - name: Install pinned Pa11y and HTML_CodeSniffer for guarded browser fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/aelira-pa11y"
          cd "$RUNNER_TEMP/aelira-pa11y"
          bun add --exact pa11y@9.0.1 html_codesniffer@2.5.1
          node -e 'for (const [name, version] of [["pa11y", "9.0.1"], ["html_codesniffer", "2.5.1"]]) { const actual = require(`${name}/package.json`).version; if (actual !== version) throw new Error(`${name}: expected ${version}, found ${actual}`); }'
          printf 'AELIRA_TEST_PA11Y_BIN=%s\n' "$RUNNER_TEMP/aelira-pa11y/node_modules/.bin/pa11y" >> "$GITHUB_ENV"
      - name: Run tests
        id: main-tests
        env:
          DATABASE_URL: postgresql://aelira:aelira@localhost:5432/aelira_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-for-ci
          ENV: test
          RUN_CONTROLLED_BROWSER_TESTS: "1"
        run: >-
          pytest tests/ -v --tb=short
          --cov-report=json:test-results/coverage.json
          --test-evidence=test-results/main-suite.json
          --test-evidence-profile=main
      - name: Enforce coverage and main-suite skip policy
        if: always() && steps.main-tests.outcome != 'skipped'
        run: >-
          python scripts/verify_test_evidence.py
          --report test-results/main-suite.json
          --coverage test-results/coverage.json
          --policy tests/ci_skip_policy.json --profile main
          --revision "${{ github.sha }}"
          --output test-results/main-summary.json
      - name: Required PDF remediation acceptance corpus
        env:
          DATABASE_URL: postgresql://aelira:aelira@localhost:5432/aelira_test
          JWT_SECRET: test-secret-for-ci
          ENV: test
        run: python scripts/pdf_acceptance_corpus.py --manifest tests/fixtures/pdf_acceptance/manifest.json
      - name: Required Office saved-package preservation corpus
        env:
          ENV: test
        run: >-
          python scripts/office_preservation_corpus.py
          --workdir test-results/office-preservation
          --revision "${{ github.sha }}"
      - name: Required pinned PDF font recovery corpus
        run: >-
          python scripts/pdf_font_recovery_corpus.py
          --output test-results/pdf-font-recovery.json --require-pinned
      - name: Retain Office source and candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: office-preservation-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/office-preservation/
          if-no-files-found: warn
          retention-days: 14
      - name: Create isolated worker test database
        env:
          PGPASSWORD: aelira
        run: createdb --host=localhost --username=aelira worker_isolation_test
      - name: Run PostgreSQL worker-isolation tests
        id: worker-tests
        env:
          DATABASE_URL: postgresql://aelira:aelira@localhost:5432/worker_isolation_test
          TEST_MIGRATION_DATABASE_URL: postgresql://aelira:aelira@localhost:5432/worker_isolation_test
          ALLOW_DESTRUCTIVE_MIGRATION_TESTS: "1"
          REQUIRE_WORKER_POSTGRES_TESTS: "1"
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-for-ci
          ENV: test
        run: >-
          pytest tests/test_durable_job_processor_postgres.py
          tests/test_reviewed_upload_journey_postgres.py -v --tb=short --no-cov
          --test-evidence=test-results/worker-postgres.json
          --test-evidence-profile=worker-postgres
      - name: Require PostgreSQL worker checks to execute
        if: always() && steps.worker-tests.outcome != 'skipped'
        run: >-
          python scripts/verify_test_evidence.py
          --report test-results/worker-postgres.json
          --policy tests/ci_skip_policy.json --profile worker-postgres
          --revision "${{ github.sha }}"
          --output test-results/worker-summary.json
      - name: Create isolated PostgreSQL race database
        env:
          PGPASSWORD: aelira
        run: createdb --host=localhost --username=aelira queue_races_test
      - name: Run PostgreSQL session, enqueue, and PDF edit races
        id: race-tests
        env:
          DATABASE_URL: postgresql://aelira:aelira@localhost:5432/queue_races_test
          TEST_DATABASE_URL: postgresql://aelira:aelira@localhost:5432/queue_races_test
          TEST_MIGRATION_DATABASE_URL: postgresql://aelira:aelira@localhost:5432/queue_races_test
          ALLOW_DESTRUCTIVE_MIGRATION_TESTS: "1"
          REQUIRE_QUEUE_POSTGRES_TESTS: "1"
          JWT_SECRET: test-secret-for-ci
          ENV: test
        run: >-
          pytest tests/test_task17b_postgres.py
          tests/test_pdf_edit_publication_postgres.py
          tests/test_session_refresh_rotation.py::test_concurrent_refreshes_serialize_and_return_identical_pair
          -v --tb=short --no-cov
          --test-evidence=test-results/queue-races-postgres.json
          --test-evidence-profile=queue-races-postgres
      - name: Require PostgreSQL race checks to execute
        if: always() && steps.race-tests.outcome != 'skipped'
        run: >-
          python scripts/verify_test_evidence.py
          --report test-results/queue-races-postgres.json
          --policy tests/ci_skip_policy.json --profile queue-races-postgres
          --revision "${{ github.sha }}"
          --output test-results/queue-races-summary.json
      - name: Install LaTeX confinement toolchain
        run: |
          timeout 5m sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install -y texlive-luatex texlive-latex-recommended latexml
      - name: Run real-tool LaTeX confinement tests
        id: latex-confinement-tests
        env:
          JWT_SECRET: test-secret-for-ci
          ENV: test
        run: >-
          pytest tests/test_latex_sandbox.py -v --tb=short --no-cov
          --test-evidence=test-results/latex-confinement.json
          --test-evidence-profile=latex-confinement
      - name: Require LaTeX confinement checks to execute
        if: always() && steps.latex-confinement-tests.outcome != 'skipped'
        run: >-
          python scripts/verify_test_evidence.py
          --report test-results/latex-confinement.json
          --policy tests/ci_skip_policy.json --profile latex-confinement
          --revision "${{ github.sha }}"
          --output test-results/latex-confinement-summary.json
      - name: Retain revision-bound test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/*.json
          if-no-files-found: warn
          retention-days: 14

  document-stack:
    name: Real document queue and artifact acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: aelira
          POSTGRES_PASSWORD: aelira
          POSTGRES_DB: document_acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '18325:8025']
    env:
      ENV: production
      DEBUG: 'false'
      ALLOW_MOCK_AUTH: 'false'
      DATABASE_URL: postgresql://aelira:aelira@localhost:5432/document_acceptance
      REDIS_URL: redis://localhost:6379/0
      LLM_PROVIDER: none
      LLM_FALLBACK_PROVIDER: none
      EMBEDDING_PROVIDER: none
      OPEN_SIGNUP: 'false'
      DEFAULT_DEPARTMENT_TIER: department
      PUBLIC_API_URL: http://localhost:18300
      PUBLIC_DASHBOARD_URL: http://localhost:15373
      PUBLIC_WEBSITE_URL: http://localhost:15373
      MAGIC_LINK_BASE_URL: http://localhost:15373
      CORS_ORIGINS: http://localhost:15373
      SESSION_COOKIE_SECURE: 'false'
      CSRF_COOKIE_SECURE: 'false'
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      FROM_EMAIL: noreply@example.org
      MARKETING_EMAIL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install document runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config tesseract-ocr ghostscript poppler-utils unzip zip pandoc latexml texlive-latex-recommended texlive-science texlive-pictures texlive-lang-german
          curl -fsSL --retry 3 https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-1-amd64.deb -o "$RUNNER_TEMP/pandoc.deb"
          printf '%s  %s\n' ab0ac0aa1c3f9b23243d14e43023e06cbce51a52420aba17d27bd0d9c28f73ac "$RUNNER_TEMP/pandoc.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          test "$(pandoc --version | head -n 1)" = 'pandoc 3.1.11.1'
          pip install -r requirements-dev.txt
      - name: Verify real API, durable worker and downloaded files
        run: |
          set -euo pipefail
          node --experimental-strip-types --test scripts/latex_corpus_contract.test.ts scripts/latex_html_corpus_contract.test.ts scripts/latex_compilation_contract.test.ts scripts/document_stack_transport.test.ts
          mkdir -p test-results/document-stack
          python -c 'import json, sys; from importlib.metadata import version; print(json.dumps({"python": sys.version, "packages": {name: version(name) for name in ["pydantic", "pydantic-core", "sympy", "mpmath", "latex2mathml"]}}, indent=2))' > test-results/document-stack/runtime.json
          export JWT_SECRET="$(openssl rand -hex 48)"
          export TOKEN_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export SESSION_REPLAY_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export REMEDIATION_ARTIFACT_DIR="$RUNNER_TEMP/document-artifacts"
          export AELIRA_REMEDIATION_DIR="$REMEDIATION_ARTIFACT_DIR"
          alembic upgrade head
          uvicorn src.api.main:app --host 127.0.0.1 --port 18300 --no-proxy-headers > "$RUNNER_TEMP/document-api.log" 2>&1 &
          api_pid=$!
          python -m src.jobs.worker > "$RUNNER_TEMP/document-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$api_pid" "$worker_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl -fsS http://localhost:18300/ready >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          node --experimental-strip-types scripts/verify_document_stack.ts
          node --experimental-strip-types scripts/verify_latex_corpus_compilation.ts
      - name: Retain document journey evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: document-journey-evidence
          path: test-results/document-stack/
          if-no-files-found: warn
          retention-days: 14

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22+: the unit tests import .ts files directly and rely on
          # Node's native type stripping (unavailable on Node 20)
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  e2e-release:
    name: Deterministic Chromium release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Install deterministic release browser
        run: npx playwright install --with-deps chromium
      - name: Run release smoke
        run: npm run test:e2e:release
      - name: Run remediation policy regression
        run: ./node_modules/.bin/playwright test --config=playwright.remediation-policy.config.ts
      - name: Run workspace accessibility and auth continuation regression
        env:
          VITE_API_URL: http://localhost:8000
        run: ./node_modules/.bin/playwright test tests/dashboard-polish.spec.ts tests/auth-continuation.spec.ts --project=chromium
      - name: Run dashboard route accessibility regression
        env:
          VITE_API_URL: http://localhost:8000
        run: ./node_modules/.bin/playwright test tests/a11y-audit.spec.ts --project=chromium --workers=2

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Deliberately the CLI's supported floor (engines >=22).
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install CLI browser
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  quickstart:
    name: Quickstart (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the documented quickstart
        # A fresh runner exercises Dockerfile.dev and its non-root Pa11y gate.
        # --wait also requires both the API and durable worker to be healthy.
        run: docker compose -f docker-compose.quickstart.yml up -d --build --wait --wait-timeout 180
      - name: Verify Pa11y in the running quickstart API
        run: docker compose -f docker-compose.quickstart.yml exec -T api python scripts/smoke_pa11y_runtime.py
      - name: Verify Piper using the baked quickstart voice
        run: docker compose -f docker-compose.quickstart.yml exec -T api python scripts/smoke_piper_runtime.py
      - name: Verify shared upload storage as the runtime users
        run: |
          probe_id="$(docker compose -f docker-compose.quickstart.yml exec -T api python -c 'import uuid; print(uuid.uuid4())')"
          docker compose -f docker-compose.quickstart.yml exec -T api python scripts/smoke_quickstart_storage.py upload --probe-id "$probe_id"
          docker compose -f docker-compose.quickstart.yml exec -T worker python scripts/smoke_quickstart_storage.py worker --probe-id "$probe_id"
          docker compose -f docker-compose.quickstart.yml exec -T api python scripts/smoke_quickstart_storage.py verify --probe-id "$probe_id"
      - name: Capture quickstart diagnostics
        if: always()
        run: |
          docker compose -f docker-compose.quickstart.yml ps -a
          docker compose -f docker-compose.quickstart.yml logs --no-color --tail 100
      - name: Stop the disposable quickstart stack
        if: always()
        run: docker compose -f docker-compose.quickstart.yml down --volumes --remove-orphans

  docker:
    name: Docker (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify production Compose environment contract
        if: matrix.platform == 'linux/amd64'
        run: scripts/check-production-compose.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and verify reproducible API image
        run: scripts/verify_reproducible_image.sh . Dockerfile ${{ matrix.platform }}
      - name: Load API image for runtime checks
        run: docker buildx build --load --tag aelira-worker-isolation:test --file Dockerfile .
      - name: Record installed API image packages and require the fixed Expat library
        run: |
          set -euo pipefail
          dir=test-results/api-image-inventory
          mkdir -p "$dir"
          docker run --rm --network none --entrypoint dpkg-query aelira-worker-isolation:test \
            -W -f '${Package}\t${Architecture}\t${Version}\n' > "$dir/dpkg-packages.tsv"
          expat=$(awk -F'\t' '$1 == "libexpat1" { print $3 }' "$dir/dpkg-packages.tsv")
          test -n "$expat"
          for interpreter in /usr/local/bin/python /opt/venv/bin/python; do
            docker run --rm --network none --entrypoint "$interpreter" aelira-worker-isolation:test \
              -c 'import pyexpat, sys; print(sys.executable, "pyexpat Expat", pyexpat.EXPAT_VERSION)'
          done | tee "$dir/python-expat.txt"
          {
            echo "platform ${{ matrix.platform }}"
            echo "image $(docker image inspect aelira-worker-isolation:test --format '{{.Id}}')"
            echo "libexpat1 $expat"
          } | tee "$dir/libexpat1.txt"
          dpkg --compare-versions "$expat" ge 2.9.0 || {
            echo "libexpat1 $expat is older than the fixed 2.9.0-1~deb13u1" >&2
            exit 1
          }
      - name: Inventory every HIGH and CRITICAL finding in the API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.74.0
          scanners: vuln,secret
          timeout: 15m
          image-ref: aelira-worker-isolation:test
          format: json
          output: test-results/api-image-inventory/trivy.json
          exit-code: '0'
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.inventory
      - name: Retain API image package and vulnerability inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-image-inventory-${{ matrix.runner }}-${{ github.run_attempt }}
          path: test-results/api-image-inventory/
          if-no-files-found: warn
          retention-days: 14
      - name: Install the inventory verifier runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Reject unresolved HIGH and CRITICAL API image findings
        run: |
          set -euo pipefail
          bun run scripts/verify_trivy_inventory.ts \
            --file test-results/api-image-inventory/trivy.json \
            --image aelira-worker-isolation:test \
            --architecture ${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }} \
            --dispositions .trivy-unfixed-dispositions.json
      - name: Verify production package state and baked Piper synthesis
        run: |
          docker run --rm --network none --entrypoint /usr/local/bin/python aelira-worker-isolation:test /app/scripts/verify_final_python_packages.py global
          docker run --rm --network none --entrypoint /opt/venv/bin/python aelira-worker-isolation:test /app/scripts/verify_final_python_packages.py venv
          docker run --rm --network none --entrypoint /usr/local/bin/python aelira-worker-isolation:test /app/scripts/verify_final_os_packages.py
          docker run --rm --network none --entrypoint /opt/venv/bin/python aelira-worker-isolation:test /app/scripts/smoke_piper_runtime.py
      - name: Verify real faster-whisper download and offline load through huggingface-hub
        run: |
          hf_cache="$(mktemp -d)"
          empty_cache="$(mktemp -d)"
          chmod 777 "$hf_cache" "$empty_cache"
          docker run --rm --env HF_HOME=/hf --volume "$hf_cache:/hf" \
            --entrypoint /opt/venv/bin/python aelira-worker-isolation:test \
            /app/scripts/smoke_whisper_transcription.py download --cache-dir /hf/hub
          docker run --rm --network none --env HF_HOME=/hf --volume "$hf_cache:/hf" \
            --entrypoint /opt/venv/bin/python aelira-worker-isolation:test \
            /app/scripts/smoke_whisper_transcription.py offline --cache-dir /hf/hub
          docker run --rm --network none --env HF_HOME=/hf --volume "$empty_cache:/hf" \
            --entrypoint /opt/venv/bin/python aelira-worker-isolation:test \
            /app/scripts/smoke_whisper_transcription.py offline-refused --cache-dir /hf/hub
      - name: Verify source-built image libraries, libtiff version and OCR
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,mode=1777 \
            --entrypoint /opt/venv/bin/python aelira-worker-isolation:test \
            /app/scripts/smoke_image_libraries.py
      - name: Show psycopg2 library resolution and absent bundled directories
        run: |
          docker run --rm --network none --entrypoint /bin/sh aelira-worker-isolation:test -c '
            set -eu
            site=$(/opt/venv/bin/python -c "import sysconfig; print(sysconfig.get_paths()[\"purelib\"])")
            extension=$(ls "$site"/psycopg2/_psycopg*.so)
            uname -m
            echo "ldd $extension"
            ldd "$extension"
            echo "psycopg2 entries in site-packages:"
            ls -1 "$site" | grep -i psycopg2
            if find / -xdev -name "psycopg2*.libs" 2>/dev/null | grep .; then
              echo "bundled psycopg2 library directory exists" >&2
              exit 1
            fi
            echo "no psycopg2*.libs directory exists anywhere in the image"
          '
      - name: Run the psycopg2 database smoke test against PostgreSQL 16
        run: |
          set -euo pipefail
          mkdir -p test-results/psycopg2-runtime
          docker network create psycopg2-smoke
          docker run --detach --name psycopg2-smoke-db --network psycopg2-smoke \
            --env POSTGRES_USER=aelira --env POSTGRES_PASSWORD=smoke-test-only \
            --env POSTGRES_DB=aelira_smoke \
            --health-cmd "pg_isready --host=127.0.0.1 --username=aelira --dbname=aelira_smoke" \
            --health-interval 2s --health-timeout 5s --health-retries 30 \
            postgres:16
          for attempt in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Health.Status}}' psycopg2-smoke-db)
            [ "$state" = healthy ] && break
            sleep 2
          done
          test "$state" = healthy
          docker run --rm --network psycopg2-smoke \
            --env DATABASE_URL=postgresql://aelira:smoke-test-only@psycopg2-smoke-db:5432/aelira_smoke \
            --entrypoint /opt/venv/bin/python aelira-worker-isolation:test \
            /app/scripts/smoke_psycopg2_runtime.py | tee test-results/psycopg2-runtime/report.json
      - name: Remove the psycopg2 smoke database
        if: always()
        run: |
          mkdir -p test-results/psycopg2-runtime
          docker logs psycopg2-smoke-db > test-results/psycopg2-runtime/postgres.log 2>&1 || true
          docker rm --force psycopg2-smoke-db || true
          docker network rm psycopg2-smoke || true
      - name: Retain psycopg2 runtime evidence
