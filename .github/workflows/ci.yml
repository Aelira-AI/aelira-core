name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes any still-running CI for the same ref — saves
# Actions minutes and keeps the queue honest during rapid iteration.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-complete:
    name: CI complete
    if: always()
    needs:
      - expat-native-acceptance
      - tiff-native-package
      - python-native-components
      - lxml-native-component
      - configuration-smoke
      - dev-setup-tests
      - dependency-security
      - lint
      - test
      - document-stack
      - dashboard
      - e2e-release
      - cli
      - quickstart
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$JOB_RESULTS" | jq -e '
            length == 15 and all(.[]; .result == "success")
          '

  expat-native-acceptance:
    name: Native Expat acceptance (${{ matrix.arch }})
    permissions:
      contents: read
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate source, repeat offline native builds, and probe installed package
        env:
          AELIRA_EXPAT_EXPECT_ARCH: ${{ matrix.arch }}
          AELIRA_EXPAT_OUTPUT: ${{ runner.temp }}/expat-native-acceptance
        run: |
          mkdir -p "$AELIRA_EXPAT_OUTPUT"
          bash runtime-security/expat/native-acceptance.sh
      - name: Record native Docker storage identity
        if: always()
        env:
          AELIRA_EXPAT_OUTPUT: ${{ runner.temp }}/expat-native-acceptance
        run: |
          mkdir -p "$AELIRA_EXPAT_OUTPUT"
          docker version --format '{{json .Server.Version}}' > "$AELIRA_EXPAT_OUTPUT/docker-version.json"
          docker info --format '{{json .Driver}}' > "$AELIRA_EXPAT_OUTPUT/docker-storage-driver.json"
          docker info --format '{{json .DriverStatus}}' > "$AELIRA_EXPAT_OUTPUT/docker-storage-status.json"
      - name: Record source identity for native evidence
        if: always()
        env:
          AELIRA_EXPAT_OUTPUT: ${{ runner.temp }}/expat-native-acceptance
        run: |
          mkdir -p "$AELIRA_EXPAT_OUTPUT"
          git rev-parse HEAD > "$AELIRA_EXPAT_OUTPUT/source-revision.txt"
          git ls-files -z runtime-security/expat .github/workflows/ci.yml |
            xargs -0 sha256sum > "$AELIRA_EXPAT_OUTPUT/source-files.sha256"
      - name: Retain native source, build, and installed-consumer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expat-native-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/expat-native-acceptance/provenance/
            ${{ runner.temp }}/expat-native-acceptance/source-input/*.dsc
            ${{ runner.temp }}/expat-native-acceptance/source-input/*.orig.tar.gz
            ${{ runner.temp }}/expat-native-acceptance/source-input/*.debian.tar.xz
            ${{ runner.temp }}/expat-native-acceptance/build-*/*.log
            ${{ runner.temp }}/expat-native-acceptance/build-*/output-sha256.txt
            ${{ runner.temp }}/expat-native-acceptance/build-*/*.dsc
            ${{ runner.temp }}/expat-native-acceptance/build-*/*.debian.tar.xz
            ${{ runner.temp }}/expat-native-acceptance/build-*/libexpat1_*.deb
            ${{ runner.temp }}/expat-native-acceptance/*.txt
            ${{ runner.temp }}/expat-native-acceptance/*.json
            ${{ runner.temp }}/expat-native-acceptance/*.log
            ${{ runner.temp }}/expat-native-acceptance/source-files.sha256
          if-no-files-found: error
          retention-days: 14

  tiff-native-package:
    name: TIFF native package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test native TIFF packages
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tiff-native-output"
          python3 runtime-security/media/tiff/test-ci-evidence.py
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain -- runtime-security/media/tiff)"
          set +e
          AELIRA_TIFF_EXPECT_ARCH="${{ matrix.arch }}" AELIRA_TIFF_SAVE_BUILDER=0 \
            bash runtime-security/media/tiff/build.sh "$RUNNER_TEMP/tiff-native-output" \
            > "$RUNNER_TEMP/tiff-native-build-console.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/tiff-native-build-console.log"
          printf '%s\n' "$result" > "$RUNNER_TEMP/tiff-native-build-exit.txt"
          exit "$result"
      - name: Export bounded TIFF evidence
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          result=125
          if test -f "$RUNNER_TEMP/tiff-native-build-exit.txt"; then
            read -r result < "$RUNNER_TEMP/tiff-native-build-exit.txt"
          fi
          python3 runtime-security/media/tiff/ci-evidence.py \
            --source "$RUNNER_TEMP/tiff-native-output" \
            --dest "$RUNNER_TEMP/tiff-native-evidence" \
            --repo "$GITHUB_WORKSPACE" \
            --arch "${{ matrix.arch }}" \
            --revision "$GITHUB_SHA" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --build-exit "$result"
      - name: Upload bounded TIFF evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tiff-native-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tiff-native-evidence/
          if-no-files-found: error
          retention-days: 14

  python-native-components:
    name: Native Python component consumers (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            tiff_artifact_id: 11711217496
          - arch: arm64
            runner: ubuntu-24.04-arm
            tiff_artifact_id: 11711427167
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native proof verification utilities
        id: utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils gpgv
      - name: Fetch the accepted native TIFF artifact
        id: tiff
        env:
          GH_TOKEN: ${{ github.token }}
          TIFF_ARTIFACT_ID: ${{ matrix.tiff_artifact_id }}
        run: |
          set -euo pipefail
          gh api "repos/Aelira-AI/aelira-core/actions/artifacts/$TIFF_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/python-native-tiff.zip"
      - name: Check native evidence control tests
        id: controls
        run: |
          python3 -B runtime-security/media/pillow/test-ci-evidence.py
          python3 -B runtime-security/psycopg2/test-ci-evidence.py
          python3 -B runtime-security/python-native-ci/test-run.py
      - name: Build and verify both native Python components
        id: components
        shell: bash
        env:
          AELIRA_NATIVE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(/usr/bin/git status --porcelain)"
          set +e
          python3 runtime-security/python-native-ci/run.py \
            --repo "$GITHUB_WORKSPACE" --arch "$AELIRA_NATIVE_ARCH" \
            --expected-ref "$GITHUB_SHA" \
            --scratch "$RUNNER_TEMP/python-native-private" \
            --tiff-zip "$RUNNER_TEMP/python-native-tiff.zip" \
            --dest "$RUNNER_TEMP/python-native-evidence" \
            > "$RUNNER_TEMP/python-native-runner.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/python-native-runner-exit.txt"
          printf 'exit_code=%s\n' "$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Retain bounded workflow outcomes
        if: always() && steps.checkout.outcome == 'success'
        env:
          AELIRA_NATIVE_ARCH: ${{ matrix.arch }}
          UTILITIES_OUTCOME: ${{ steps.utilities.outcome }}
          CONTROLS_OUTCOME: ${{ steps.controls.outcome }}
          TIFF_OUTCOME: ${{ steps.tiff.outcome }}
          COMPONENT_OUTCOME: ${{ steps.components.outcome }}
          COMPONENT_EXIT: ${{ steps.components.outputs.exit_code }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          arch = os.environ['AELIRA_NATIVE_ARCH']
          assert arch in {'amd64', 'arm64'}
          revision = os.environ['GITHUB_SHA']
          assert re.fullmatch('[0-9a-f]{40}', revision)
          outcomes = {name: os.environ[name] or 'not_reported'
                      for name in ('UTILITIES_OUTCOME', 'TIFF_OUTCOME', 'CONTROLS_OUTCOME', 'COMPONENT_OUTCOME')}
          assert all(value in {'success', 'failure', 'cancelled', 'skipped', 'not_reported'}
                     for value in outcomes.values())
          raw_exit = os.environ['COMPONENT_EXIT']
          observed_exit = int(raw_exit) if raw_exit and re.fullmatch('[0-9]{1,3}', raw_exit) else None
          assert observed_exit is None or 0 <= observed_exit <= 255
          destination = Path(os.environ['RUNNER_TEMP']) / 'python-native-evidence'
          destination.mkdir(exist_ok=True)
          (destination / 'workflow-outcomes.json').write_text(json.dumps({
              'architecture': arch, 'revision': revision,
              'workflow_outcomes': outcomes, 'runner_observed_exit': observed_exit,
              'complete': all(value == 'success' for value in outcomes.values()) and observed_exit == 0,
          }, sort_keys=True, indent=2) + '\n')
          if outcomes['COMPONENT_OUTCOME'] == 'success' and observed_exit != 0:
              raise SystemExit(1)
          PY
      - name: Upload only bounded native Python evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-native-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-native-evidence/
          if-no-files-found: error
          retention-days: 14

  lxml-native-component:
    name: Native lxml component consumers (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native proof verification utilities
        id: utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils gpgv
      - name: Check native XML evidence controls
        id: controls
        run: |
          python3 -B runtime-security/lxml-native-ci/test-evidence.py
          python3 -B runtime-security/lxml-native-ci/test-run.py
      - name: Build and verify the native XML component
        id: component
        shell: bash
        env:
          AELIRA_NATIVE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(/usr/bin/git status --porcelain)"
          expected_tree=$(/usr/bin/git rev-parse HEAD^{tree})
          set +e
          python3 -I runtime-security/lxml-native-ci/run.py \
            --repo "$GITHUB_WORKSPACE" --arch "$AELIRA_NATIVE_ARCH" \
            --expected-ref "$GITHUB_SHA" --expected-tree "$expected_tree" \
            --scratch "$RUNNER_TEMP/lxml-native-private" \
            --dest "$RUNNER_TEMP/lxml-native-evidence" \
            > "$RUNNER_TEMP/lxml-native-runner.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/lxml-native-runner-exit.txt"
          printf 'exit_code=%s\n' "$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Retain bounded workflow outcomes
        if: always() && steps.checkout.outcome == 'success'
        env:
          AELIRA_NATIVE_ARCH: ${{ matrix.arch }}
          UTILITIES_OUTCOME: ${{ steps.utilities.outcome }}
          CONTROLS_OUTCOME: ${{ steps.controls.outcome }}
          COMPONENT_OUTCOME: ${{ steps.component.outcome }}
          COMPONENT_EXIT: ${{ steps.component.outputs.exit_code }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          arch = os.environ['AELIRA_NATIVE_ARCH']
          assert arch in {'amd64', 'arm64'}
          revision = os.environ['GITHUB_SHA']
          assert re.fullmatch('[0-9a-f]{40}', revision)
          outcomes = {name: os.environ[name] or 'not_reported'
                      for name in ('UTILITIES_OUTCOME', 'CONTROLS_OUTCOME', 'COMPONENT_OUTCOME')}
          assert all(value in {'success', 'failure', 'cancelled', 'skipped', 'not_reported'}
                     for value in outcomes.values())
          raw_exit = os.environ['COMPONENT_EXIT']
          observed_exit = int(raw_exit) if raw_exit and re.fullmatch('[0-9]{1,3}', raw_exit) else None
          assert observed_exit is None or 0 <= observed_exit <= 255
          destination = Path(os.environ['RUNNER_TEMP']) / 'lxml-native-evidence'
          destination.mkdir(exist_ok=True)
          (destination / 'workflow-outcomes.json').write_text(json.dumps({
              'architecture': arch, 'revision': revision,
              'workflow_outcomes': outcomes, 'runner_observed_exit': observed_exit,
              'complete': all(value == 'success' for value in outcomes.values()) and observed_exit == 0,
          }, sort_keys=True, indent=2) + '\n')
          if outcomes['COMPONENT_OUTCOME'] == 'success' and observed_exit != 0:
              raise SystemExit(1)
          PY
      - name: Upload only bounded native XML evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lxml-native-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lxml-native-evidence/
          if-no-files-found: error
          retention-days: 14

  configuration-smoke:
    name: Shipped configuration smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify Docker context exclusions and required inputs
        run: python scripts/verify_build_context.py
      - name: Verify API proxy routes against a disposable upstream
        run: python scripts/verify_nginx_api.py
      - name: Verify dashboard assets and proxy routing
        run: python scripts/verify_nginx_dashboard.py

  dev-setup-tests:
    name: Development setup orchestration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Check setup script and executable orchestration tests
        run: |
          bash -n setup-dev.sh
          jq --version
          node --experimental-strip-types --test scripts/dev_setup.test.ts

  dependency-security:
    name: Shipped dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Python audit build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config
      - name: Validate Trivy exemption governance
        run: python scripts/verify_trivy_allowlist.py .trivyignore
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Test complete image inventory gate
        run: bun test scripts/verify_trivy_inventory.test.ts
      - name: Audit Python runtime dependencies
        run: |
          python -m pip install 'pip-audit==2.10.0'
          pip-audit --requirement requirements.txt --strict
          pip-audit --requirement requirements-dev.txt --strict
      - name: Audit shipped npm surfaces
        run: |
          npm --prefix cli audit --audit-level=high
          npm --prefix dashboard audit --audit-level=high
          npm --prefix pa11y-runtime audit --audit-level=high
      - name: Review pull-request dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install linters
        run: pip install "ruff==0.16.5" "black==26.5.1"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: black --check src/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      artifact-metadata: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aelira
          POSTGRES_PASSWORD: aelira
          POSTGRES_DB: aelira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install system dependencies
        # cairo/pkg-config: pycairo builds from source; OCRmyPDF uses
        # unpaper/Ghostscript and its fallback uses Poppler/Tesseract.
        # ffmpeg: multimedia tests; pandoc: actual siunitx fidelity controls.
        run: |
          timeout 5m sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
          timeout 5m sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install -y libcairo2-dev pkg-config \
            tesseract-ocr tesseract-ocr-eng unpaper ghostscript poppler-utils ffmpeg pandoc
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate release journey inventory
        run: >-
          python scripts/verify_release_journeys.py
          --revision "${{ github.sha }}"
          --output test-results/journey-matrix.json
      - name: Install pinned equation-verifier browser
        run: |
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              print(f"AELIRA_TEST_CHROMIUM_EXECUTABLE={playwright.chromium.executable_path}")
          PY
      - name: Install pinned Pa11y and HTML_CodeSniffer for guarded browser fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/aelira-pa11y"
          cd "$RUNNER_TEMP/aelira-pa11y"
          bun add --exact pa11y@9.0.1 html_codesniffer@2.5.1
          node -e 'for (const [name, version] of [["pa11y", "9.0.1"], ["html_codesniffer", "2.5.1"]]) { const actual = require(`${name}/package.json`).version; if (actual !== version) throw new Error(`${name}: expected ${version}, found ${actual}`); }'
          printf 'AELIRA_TEST_PA11Y_BIN=%s\n' "$RUNNER_TEMP/aelira-pa11y/node_modules/.bin/pa11y" >> "$GITHUB_ENV"
      - name: Run tests
        id: main-tests
        env:
          DATABASE_URL: postgresql://aelira:aelira@localhost:5432/aelira_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-for-ci
          ENV: test
          RUN_CONTROLLED_BROWSER_TESTS: "1"
        run: >-
          pytest tests/ -v --tb=short
          --cov-report=json:test-results/coverage.json
          --test-evidence=test-results/main-suite.json
          --test-evidence-profile=main
      - name: Enforce coverage and main-suite skip policy
        if: always() && steps.main-tests.outcome != 'skipped'
        run: >-
          python scripts/verify_test_evidence.py
          --report test-results/main-suite.json
          --coverage test-results/coverage.json
          --policy tests/ci_skip_policy.json --profile main
          --revision "${{ github.sha }}"
          --output test-results/main-summary.json
      - name: Required PDF remediation acceptance corpus
        env:
          DATABASE_URL: postgresql://aelira:aelira@localhost:5432/aelira_test
          JWT_SECRET: test-secret-for-ci
          ENV: test
        run: python scripts/pdf_acceptance_corpus.py --manifest tests/fixtures/pdf_acceptance/manifest.json
      - name: Required Office saved-package preservation corpus
        env:
          ENV: test
        run: >-
          python scripts/office_preservation_corpus.py
          --workdir test-results/office-preservation
          --revision "${{ github.sha }}"
      - name: Required pinned PDF font recovery corpus
        run: >-
          python scripts/pdf_font_recovery_corpus.py
          --output test-results/pdf-font-recovery.json --require-pinned
      - name: Retain Office source and candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: office-preservation-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/office-preservation/
          if-no-files-found: warn
          retention-days: 14
      - name: Create isolated worker test database
        env:
          PGPASSWORD: aelira
        run: createdb --host=localhost --username=aelira worker_isolation_test
      - name: Run PostgreSQL worker-isolation tests
        id: worker-tests
        env:
          DATABASE_URL: postgresql://aelira:aelira@localhost:5432/worker_isolation_test
          TEST_MIGRATION_DATABASE_URL: postgresql://aelira:aelira@localhost:5432/worker_isolation_test
          ALLOW_DESTRUCTIVE_MIGRATION_TESTS: "1"
          REQUIRE_WORKER_POSTGRES_TESTS: "1"
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-for-ci
          ENV: test
        run: >-
          pytest tests/test_durable_job_processor_postgres.py
          tests/test_reviewed_upload_journey_postgres.py -v --tb=short --no-cov
          --test-evidence=test-results/worker-postgres.json
          --test-evidence-profile=worker-postgres
      - name: Require PostgreSQL worker checks to execute
        if: always() && steps.worker-tests.outcome != 'skipped'
        run: >-
          python scripts/verify_test_evidence.py
          --report test-results/worker-postgres.json
          --policy tests/ci_skip_policy.json --profile worker-postgres
          --revision "${{ github.sha }}"
          --output test-results/worker-summary.json
      - name: Create isolated PostgreSQL race database
        env:
          PGPASSWORD: aelira
        run: createdb --host=localhost --username=aelira queue_races_test
      - name: Run PostgreSQL session, enqueue, and PDF edit races
        id: race-tests
        env:
          DATABASE_URL: postgresql://aelira:aelira@localhost:5432/queue_races_test
          TEST_DATABASE_URL: postgresql://aelira:aelira@localhost:5432/queue_races_test
          TEST_MIGRATION_DATABASE_URL: postgresql://aelira:aelira@localhost:5432/queue_races_test
          ALLOW_DESTRUCTIVE_MIGRATION_TESTS: "1"
          REQUIRE_QUEUE_POSTGRES_TESTS: "1"
          JWT_SECRET: test-secret-for-ci
          ENV: test
        run: >-
          pytest tests/test_task17b_postgres.py
          tests/test_pdf_edit_publication_postgres.py
          tests/test_session_refresh_rotation.py::test_concurrent_refreshes_serialize_and_return_identical_pair
          -v --tb=short --no-cov
          --test-evidence=test-results/queue-races-postgres.json
          --test-evidence-profile=queue-races-postgres
      - name: Require PostgreSQL race checks to execute
        if: always() && steps.race-tests.outcome != 'skipped'
        run: >-
          python scripts/verify_test_evidence.py
          --report test-results/queue-races-postgres.json
          --policy tests/ci_skip_policy.json --profile queue-races-postgres
          --revision "${{ github.sha }}"
          --output test-results/queue-races-summary.json
      - name: Retain revision-bound test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/*.json
          if-no-files-found: warn
          retention-days: 14

  document-stack:
    name: Real document queue and artifact acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: aelira
          POSTGRES_PASSWORD: aelira
          POSTGRES_DB: document_acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '18325:8025']
    env:
      ENV: production
      DEBUG: 'false'
      ALLOW_MOCK_AUTH: 'false'
      DATABASE_URL: postgresql://aelira:aelira@localhost:5432/document_acceptance
      REDIS_URL: redis://localhost:6379/0
      LLM_PROVIDER: none
      LLM_FALLBACK_PROVIDER: none
      EMBEDDING_PROVIDER: none
      OPEN_SIGNUP: 'false'
      DEFAULT_DEPARTMENT_TIER: department
      PUBLIC_API_URL: http://localhost:18300
      PUBLIC_DASHBOARD_URL: http://localhost:15373
      PUBLIC_WEBSITE_URL: http://localhost:15373
      MAGIC_LINK_BASE_URL: http://localhost:15373
      CORS_ORIGINS: http://localhost:15373
      SESSION_COOKIE_SECURE: 'false'
      CSRF_COOKIE_SECURE: 'false'
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      FROM_EMAIL: noreply@example.org
      MARKETING_EMAIL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install document runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config tesseract-ocr ghostscript poppler-utils unzip zip pandoc latexml texlive-latex-recommended texlive-science texlive-pictures texlive-lang-german
          curl -fsSL --retry 3 https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-1-amd64.deb -o "$RUNNER_TEMP/pandoc.deb"
          printf '%s  %s\n' ab0ac0aa1c3f9b23243d14e43023e06cbce51a52420aba17d27bd0d9c28f73ac "$RUNNER_TEMP/pandoc.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          test "$(pandoc --version | head -n 1)" = 'pandoc 3.1.11.1'
          pip install -r requirements-dev.txt
      - name: Verify real API, durable worker and downloaded files
        run: |
          set -euo pipefail
          node --experimental-strip-types --test scripts/latex_corpus_contract.test.ts scripts/latex_html_corpus_contract.test.ts scripts/latex_compilation_contract.test.ts scripts/document_stack_transport.test.ts
          mkdir -p test-results/document-stack
          python -c 'import json, sys; from importlib.metadata import version; print(json.dumps({"python": sys.version, "packages": {name: version(name) for name in ["pydantic", "pydantic-core", "sympy", "mpmath", "latex2mathml"]}}, indent=2))' > test-results/document-stack/runtime.json
          export JWT_SECRET="$(openssl rand -hex 48)"
          export TOKEN_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export SESSION_REPLAY_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export REMEDIATION_ARTIFACT_DIR="$RUNNER_TEMP/document-artifacts"
          export AELIRA_REMEDIATION_DIR="$REMEDIATION_ARTIFACT_DIR"
          alembic upgrade head
          uvicorn src.api.main:app --host 127.0.0.1 --port 18300 --no-proxy-headers > "$RUNNER_TEMP/document-api.log" 2>&1 &
          api_pid=$!
          python -m src.jobs.worker > "$RUNNER_TEMP/document-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$api_pid" "$worker_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl -fsS http://localhost:18300/ready >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          node --experimental-strip-types scripts/verify_document_stack.ts
          node --experimental-strip-types scripts/verify_latex_corpus_compilation.ts
      - name: Retain document journey evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: document-journey-evidence
          path: test-results/document-stack/
          if-no-files-found: warn
          retention-days: 14

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22+: the unit tests import .ts files directly and rely on
          # Node's native type stripping (unavailable on Node 20)
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  e2e-release:
    name: Deterministic Chromium release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Install deterministic release browser
        run: npx playwright install --with-deps chromium
      - name: Run release smoke
        run: npm run test:e2e:release
      - name: Run remediation policy regression
        run: ./node_modules/.bin/playwright test --config=playwright.remediation-policy.config.ts
      - name: Run workspace accessibility and auth continuation regression
        env:
          VITE_API_URL: http://localhost:8000
        run: ./node_modules/.bin/playwright test tests/dashboard-polish.spec.ts tests/auth-continuation.spec.ts --project=chromium

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Deliberately the CLI's supported floor (engines >=22).
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install CLI browser
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  quickstart:
    name: Quickstart (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the documented quickstart
        # A fresh runner exercises Dockerfile.dev and its non-root Pa11y gate.
        # --wait also requires both the API and durable worker to be healthy.
        run: docker compose -f docker-compose.quickstart.yml up -d --build --wait --wait-timeout 180
      - name: Verify Pa11y in the running quickstart API
        run: docker compose -f docker-compose.quickstart.yml exec -T api python scripts/smoke_pa11y_runtime.py
      - name: Verify Piper using the baked quickstart voice
        run: docker compose -f docker-compose.quickstart.yml exec -T api python scripts/smoke_piper_runtime.py
      - name: Verify shared upload storage as the runtime users
        run: |
          probe_id="$(docker compose -f docker-compose.quickstart.yml exec -T api python -c 'import uuid; print(uuid.uuid4())')"
          docker compose -f docker-compose.quickstart.yml exec -T api python scripts/smoke_quickstart_storage.py upload --probe-id "$probe_id"
          docker compose -f docker-compose.quickstart.yml exec -T worker python scripts/smoke_quickstart_storage.py worker --probe-id "$probe_id"
          docker compose -f docker-compose.quickstart.yml exec -T api python scripts/smoke_quickstart_storage.py verify --probe-id "$probe_id"
      - name: Capture quickstart diagnostics
        if: always()
        run: |
          docker compose -f docker-compose.quickstart.yml ps -a
          docker compose -f docker-compose.quickstart.yml logs --no-color --tail 100
      - name: Stop the disposable quickstart stack
        if: always()
        run: docker compose -f docker-compose.quickstart.yml down --volumes --remove-orphans

  docker:
    name: Docker (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify production Compose environment contract
        if: matrix.platform == 'linux/amd64'
        run: scripts/check-production-compose.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and verify reproducible API image
        run: scripts/verify_reproducible_image.sh . Dockerfile ${{ matrix.platform }}
      - name: Load API image for runtime checks
        run: docker buildx build --load --tag aelira-worker-isolation:test --file Dockerfile .
      - name: Verify production package state and baked Piper synthesis
        run: |
          docker run --rm --network none --entrypoint /usr/local/bin/python aelira-worker-isolation:test /app/scripts/verify_final_python_packages.py global
          docker run --rm --network none --entrypoint /opt/venv/bin/python aelira-worker-isolation:test /app/scripts/verify_final_python_packages.py venv
          docker run --rm --network none --entrypoint /opt/venv/bin/python aelira-worker-isolation:test /app/scripts/smoke_piper_runtime.py
      - name: Enforce 0.75-CPU worker isolation under representative saturation
        if: matrix.platform == 'linux/amd64'
        run: python3 scripts/verify_worker_cpu_isolation.py --image aelira-worker-isolation:test
      - name: Verify non-root LaTeX runtime with cold scratch and read-only root
        run: |
          mkdir -p test-results/latex-runtime
          image_id=$(docker image inspect aelira-worker-isolation:test --format '{{.Id}}')
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,mode=1777 \
            --env AELIRA_RUNTIME_IMAGE_ID="$image_id" \
            --entrypoint /opt/venv/bin/python aelira-worker-isolation:test \
            /app/scripts/smoke_latex_runtime.py > test-results/latex-runtime/report.json
          python3 -c 'import json; r=json.load(open("test-results/latex-runtime/report.json")); assert r["uid"] == 1000 and r["status"] == "ready"'
      - name: Retain functional LaTeX runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latex-runtime-${{ matrix.runner }}
          path: test-results/latex-runtime/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify authored LaTeX metadata in saved exports
        run: |
          mkdir -p test-results/latex-metadata
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,mode=1777 \
            --entrypoint /opt/venv/bin/python aelira-worker-isolation:test \
            /app/scripts/smoke_latex_metadata.py > test-results/latex-metadata/report.json
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,mode=1777 \
            --entrypoint /opt/venv/bin/python aelira-worker-isolation:test \
            /app/scripts/smoke_latex_structure_metadata.py > test-results/latex-metadata/structure-report.json
      - name: Retain authored LaTeX metadata evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latex-metadata-${{ matrix.runner }}
          path: test-results/latex-metadata/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify authored LaTeX figure and table relationships
        run: |
          mkdir -p test-results/latex-semantics
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,mode=1777 \
            --entrypoint /opt/venv/bin/python aelira-worker-isolation:test \
            /app/scripts/smoke_latex_semantics.py > test-results/latex-semantics/report.json
      - name: Retain authored LaTeX relationship evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latex-semantics-${{ matrix.runner }}
          path: test-results/latex-semantics/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify complete authored LaTeX source projects
        run: |
          mkdir -p test-results/latex-projects
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,mode=1777 \
            --entrypoint /opt/venv/bin/python aelira-worker-isolation:test \
            /app/scripts/smoke_latex_projects.py > test-results/latex-projects/report.json
      - name: Retain authored LaTeX source project evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latex-projects-${{ matrix.runner }}
          path: test-results/latex-projects/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify measured LaTeX compatibility and equation provenance
        run: |
          mkdir -p test-results/latex-compatibility
          image_id=$(docker image inspect aelira-worker-isolation:test --format '{{.Id}}')
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,mode=1777 \
            --env AELIRA_RUNTIME_IMAGE_ID="$image_id" \
            --mount type=bind,source="$PWD/tests/fixtures/latex_compatibility",target=/app/tests/fixtures/latex_compatibility,readonly \
            --mount type=bind,source="$PWD/tests/fixtures/latex_validation",target=/app/tests/fixtures/latex_validation,readonly \
            --mount type=bind,source="$PWD/tests/fixtures/latex_research",target=/app/tests/fixtures/latex_research,readonly \
            --entrypoint /opt/venv/bin/python aelira-worker-isolation:test \
            /app/scripts/smoke_latex_compatibility.py > test-results/latex-compatibility/report.json
      - name: Retain LaTeX compatibility and provenance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latex-compatibility-${{ matrix.runner }}
          path: test-results/latex-compatibility/
          if-no-files-found: warn
          retention-days: 14
      - name: Build and verify reproducible dashboard image
        run: scripts/verify_reproducible_image.sh dashboard dashboard/Dockerfile ${{ matrix.platform }}
