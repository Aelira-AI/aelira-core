name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install linters
        run: pip install "ruff==0.16.3" "black==26.1.0"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: black --check src/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aelira
          POSTGRES_PASSWORD: aelira
          POSTGRES_DB: aelira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install system dependencies
        # cairo/pkg-config: pycairo builds from source; tesseract: OCR tests;
        # ffmpeg: multimedia tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config \
            tesseract-ocr tesseract-ocr-eng ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          DATABASE_URL: postgresql://aelira:aelira@localhost:5432/aelira_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-for-ci
          ENV: test
        run: pytest tests/ -v --tb=short

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t aelira-core:test .
