name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  # All releases update shared minor/latest tags; serialize every version so
  # separate tag pushes cannot interleave those mutable promotions.
  group: release-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci-gate:
    uses: ./.github/workflows/ci-gate.yml
    permissions:
      actions: read
      checks: read
      contents: read

  preflight:
    needs: ci-gate
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Validate release version and safety
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_DENYLIST_JSON: ${{ secrets.RELEASE_DENYLIST_JSON }}
        run: |
          set -euo pipefail
          TAG_OBJECT=$(git rev-parse "$TAG_NAME^{tag}") || {
            echo "Release ref must be an annotated tag: $TAG_NAME" >&2
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT" \
            | jq -e '.verification.verified == true' >/dev/null || {
              echo "Release tag must have a GitHub-verified signature: $TAG_NAME" >&2
              exit 1
            }
          POLICY_PATH="$RUNNER_TEMP/release-denylist.json"
          trap 'rm -f -- "$POLICY_PATH"' EXIT
          if [ -z "$RELEASE_DENYLIST_JSON" ]; then
            echo "Protected release policy is unavailable" >&2
            exit 1
          fi
          printf '%s' "$RELEASE_DENYLIST_JSON" > "$POLICY_PATH"
          chmod 600 "$POLICY_PATH"
          unset RELEASE_DENYLIST_JSON
          node --experimental-strip-types scripts/release_channel.ts "$TAG_NAME" > "$RUNNER_TEMP/release-plan.json"
          RELEASE_BODY_PATH="docs/releases/$TAG_NAME.md"
          [ -f "$RELEASE_BODY_PATH" ] && [ -s "$RELEASE_BODY_PATH" ] || {
            echo "Missing or empty checked-in release body: $RELEASE_BODY_PATH" >&2
            exit 1
          }
          TAG_VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./cli/package.json').version")
          LOCK_VERSION=$(node -p "require('./cli/package-lock.json').version")
          LOCK_ROOT_VERSION=$(node -p "require('./cli/package-lock.json').packages[''].version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ] || \
             [ "$TAG_VERSION" != "$LOCK_VERSION" ] || \
             [ "$TAG_VERSION" != "$LOCK_ROOT_VERSION" ]; then
            echo "Version mismatch: tag=$TAG_VERSION package=$PACKAGE_VERSION lock=$LOCK_VERSION lock-root=$LOCK_ROOT_VERSION" >&2
            exit 1
          fi
          python scripts/verify_semver_bump.py --version "$TAG_VERSION"
          python scripts/verify_release_safety.py \
            --strict-policy \
            --denylist "$POLICY_PATH"
          rm -f -- "$POLICY_PATH"
          trap - EXIT

      - name: Generate dependency CycloneDX JSON SBOMs
        run: |
          set -euo pipefail
          test -f requirements.txt
          test -f cli/package-lock.json
          test -f dashboard/package-lock.json
          mkdir dependency-sboms
          python -m pip install cyclonedx-bom==7.3.1
          cyclonedx-py requirements requirements.txt \
            --output-format JSON \
            --output-file dependency-sboms/python.cdx.json
          (
            cd cli
            npx --yes @cyclonedx/cyclonedx-npm@6.0.1 \
              --package-lock-only \
              --output-file ../dependency-sboms/cli.cdx.json
          )
          (
            cd dashboard
            npx --yes @cyclonedx/cyclonedx-npm@6.0.1 \
              --package-lock-only \
              --output-file ../dependency-sboms/dashboard.cdx.json
          )

      - name: Upload dependency SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-sboms-${{ github.run_attempt }}
          path: dependency-sboms/*.cdx.json
          retention-days: 90
          if-no-files-found: error
          overwrite: false

  docker-publish:
    needs: preflight
    uses: ./.github/workflows/publish-docker.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

  npm-publish:
    needs: docker-publish
    uses: ./.github/workflows/publish-npm.yml
    permissions:
      contents: read
      id-token: write

  github-release:
    needs: npm-publish
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Download dependency SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dependency-sboms-+([0-9])
          path: release-assets
          merge-multiple: true

      - name: Download image SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-@(aelira-core-api|aelira-core-dashboard)-@(amd64|arm64)-+([0-9])
          path: release-assets
          merge-multiple: true

      - name: Verify exact release SBOM set
        run: |
          set -euo pipefail
          EXPECTED_CYCLONEDX=3
          EXPECTED_SPDX=4
          EXPECTED_FILES=(
            release-assets/python.cdx.json
            release-assets/cli.cdx.json
            release-assets/dashboard.cdx.json
            release-assets/aelira-core-api-amd64.spdx.json
            release-assets/aelira-core-api-arm64.spdx.json
            release-assets/aelira-core-dashboard-amd64.spdx.json
            release-assets/aelira-core-dashboard-arm64.spdx.json
          )
          mapfile -t CYCLONEDX < <(find release-assets -maxdepth 1 -type f -name '*.cdx.json' -print | sort)
          mapfile -t SPDX < <(find release-assets -maxdepth 1 -type f -name '*.spdx.json' -print | sort)
          mapfile -t ALL_ASSETS < <(find release-assets -maxdepth 1 -type f -print | sort)
          [ "${#CYCLONEDX[@]}" -eq "$EXPECTED_CYCLONEDX" ]
          [ "${#SPDX[@]}" -eq "$EXPECTED_SPDX" ]
          [ "${#ALL_ASSETS[@]}" -eq 7 ]
          for asset in "${EXPECTED_FILES[@]}"; do
            [ -f "$asset" ] || {
              echo "Missing expected release SBOM: $asset" >&2
              exit 1
            }
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/release_channel.ts "$TAG_NAME" > "$RUNNER_TEMP/release-plan.json"
          RELEASE_ARGS=()
          while IFS= read -r arg; do RELEASE_ARGS+=("$arg"); done < <(jq -r '.githubArgs[]' "$RUNNER_TEMP/release-plan.json")
          RELEASE_BODY_PATH="docs/releases/$TAG_NAME.md"
          [ -f "$RELEASE_BODY_PATH" ] && [ -s "$RELEASE_BODY_PATH" ] || {
            echo "Missing or empty checked-in release body: $RELEASE_BODY_PATH" >&2
            exit 1
          }
          CYCLONEDX=(release-assets/*.cdx.json)
          SPDX=(release-assets/*.spdx.json)
          gh release create "$TAG_NAME" \
            "${CYCLONEDX[@]}" \
            "${SPDX[@]}" \
            "${RELEASE_ARGS[@]}" \
            --verify-tag \
            --title "$TAG_NAME" \
            --notes-file "$RELEASE_BODY_PATH"

      - name: Sync release metadata to marketing site
        env:
          SITE_TOKEN: ${{ secrets.AELIRA_SITE_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_TOKEN:-}" ]; then
            echo "AELIRA_SITE_TOKEN secret is not configured; skipping marketing site sync."
            exit 0
          fi

          SITE_REPO="rdcrampton/aelira-site"
          TEMP_DIR="$RUNNER_TEMP/site-sync"
          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" > "$TEMP_DIR/release.json"
          cp cli/package.json "$TEMP_DIR/package.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$TAG_NAME" > "$TEMP_DIR/commit.json"

          git clone "https://x-access-token:${SITE_TOKEN}@github.com/${SITE_REPO}.git" "$TEMP_DIR/aelira-site"
          cd "$TEMP_DIR/aelira-site"

          node scripts/open-core-release.mjs \
            --release-file "$TEMP_DIR/release.json" \
            --package-file "$TEMP_DIR/package.json" \
            --commit-file "$TEMP_DIR/commit.json" \
            --output data/open-core-release.json

          if git diff --quiet -- data/open-core-release.json; then
            echo "Site release metadata already matches $TAG_NAME."
            exit 0
          fi

          BRANCH="automation/open-core-release-$TAG_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add data/open-core-release.json
          git commit -m "chore: update open-core release metadata to $TAG_NAME"
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

          export GH_TOKEN="$SITE_TOKEN"
          TITLE="chore: update open-core release metadata to $TAG_NAME"
          BODY="Updates the website-owned release artifact from the latest validated immutable stable aelira-core release ($TAG_NAME).

          Triggered automatically by aelira-core release publication."

          PR_NUMBER="$(gh pr list --repo "$SITE_REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" --repo "$SITE_REPO" --title "$TITLE" --body "$BODY"
          else
            gh pr create --repo "$SITE_REPO" --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi
