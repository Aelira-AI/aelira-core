name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  # All releases update shared minor/latest tags; serialize every version so
  # separate tag pushes cannot interleave those mutable promotions.
  group: release-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci-gate:
    uses: ./.github/workflows/ci-gate.yml
    permissions:
      actions: read
      checks: read
      contents: read

  preflight:
    needs: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Validate stable version and release safety
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be strict stable semver (vMAJOR.MINOR.PATCH): $TAG_NAME" >&2
            exit 1
          fi
          TAG_VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./cli/package.json').version")
          LOCK_VERSION=$(node -p "require('./cli/package-lock.json').version")
          LOCK_ROOT_VERSION=$(node -p "require('./cli/package-lock.json').packages[''].version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ] || \
             [ "$TAG_VERSION" != "$LOCK_VERSION" ] || \
             [ "$TAG_VERSION" != "$LOCK_ROOT_VERSION" ]; then
            echo "Version mismatch: tag=$TAG_VERSION package=$PACKAGE_VERSION lock=$LOCK_VERSION lock-root=$LOCK_ROOT_VERSION" >&2
            exit 1
          fi
          python scripts/verify_release_safety.py

  docker-publish:
    needs: preflight
    uses: ./.github/workflows/publish-docker.yml
    permissions:
      contents: read
      packages: write

  npm-publish:
    needs: docker-publish
    uses: ./.github/workflows/publish-npm.yml
    permissions:
      contents: read
      id-token: write

  github-release:
    needs: npm-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            echo "body=Initial release" >> "$GITHUB_OUTPUT"
          else
            {
              echo 'body<<RELEASE_EOF'
              echo "## Changes since $PREV_TAG"
              echo
              git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges
              echo
              echo 'RELEASE_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_BODY: ${{ steps.notes.outputs.body }}
        run: |
          gh release create "$TAG_NAME" \
            --verify-tag \
            --title "$TAG_NAME" \
            --notes "$RELEASE_BODY"
