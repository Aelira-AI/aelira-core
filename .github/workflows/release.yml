name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # No release unless all five CI checks are green on the tagged SHA.
  ci-gate:
    uses: ./.github/workflows/ci-gate.yml
    permissions:
      checks: read
      contents: read

  release:
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Mechanically unavoidable release gate: no GitHub release is created
      # unless the tagged tree passes the safety scan.
      - name: Release safety gate
        run: python scripts/verify_release_safety.py

      - name: Generate release notes
        id: notes
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "body=Initial release" >> "$GITHUB_OUTPUT"
          else
            NOTES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges)
            {
              echo 'body<<RELEASE_EOF'
              echo "## Changes since $PREV_TAG"
              echo ""
              echo "$NOTES"
              echo 'RELEASE_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_BODY: ${{ steps.notes.outputs.body }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes "$RELEASE_BODY"
