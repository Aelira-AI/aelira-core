name: Publish Docker images

on:
  workflow_call:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.image }} for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aelira-core-api
            context: .
            dockerfile: Dockerfile
            platform: linux/amd64
            runner: ubuntu-24.04
            timeout: 120
            arch: amd64
          - image: aelira-core-api
            context: .
            dockerfile: Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            timeout: 120
            arch: arm64
          - image: aelira-core-dashboard
            context: ./dashboard
            dockerfile: ./dashboard/Dockerfile
            platform: linux/amd64
            runner: ubuntu-24.04
            timeout: 30
            arch: amd64
          - image: aelira-core-dashboard
            context: ./dashboard
            dockerfile: ./dashboard/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            timeout: 30
            arch: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          # Receipts and promotion intentionally identify the platform manifest.
          # Default BuildKit provenance wraps a single-platform result in an OCI
          # index, which would make those digest/platform assertions ambiguous.
          provenance: false
          outputs: type=image,name=ghcr.io/aelira-ai/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Generate SPDX JSON SBOM for immutable image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/aelira-ai/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.image }}-${{ matrix.arch }}.spdx.json

      - name: Inventory all high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ghcr.io/aelira-ai/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: json
          output: ${{ matrix.image }}-${{ matrix.arch }}.trivy.json
          exit-code: '0'
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.inventory

      - name: Upload Trivy vulnerability inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ matrix.image }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ matrix.image }}-${{ matrix.arch }}.trivy.json
          retention-days: 90
          if-no-files-found: error
          overwrite: false

      - name: Scan immutable image for fixed high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ghcr.io/aelira-ai/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Attest immutable image provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/aelira-ai/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify immutable image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE: ghcr.io/aelira-ai/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "$GITHUB_REPOSITORY"

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.6.1'

      - name: Sign and verify immutable image
        env:
          IMAGE: ghcr.io/aelira-ai/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/publish-docker.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            "$IMAGE@$DIGEST"

      - name: Upload SPDX JSON SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.image }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ matrix.image }}-${{ matrix.arch }}.spdx.json
          retention-days: 90
          if-no-files-found: error
          overwrite: false

      - name: Write digest receipt
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE: ghcr.io/aelira-ai/${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RECEIPT: ${{ matrix.image }}-${{ matrix.arch }}.json
        run: |
          set -euo pipefail
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg image "$IMAGE" \
            --arg platform "$PLATFORM" \
            --arg digest "$DIGEST" \
            '{source_sha: $source_sha, image: $image, platform: $platform, digest: $digest}' \
            > "$RECEIPT"

      - name: Upload digest receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipt-${{ matrix.image }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ matrix.image }}-${{ matrix.arch }}.json
          retention-days: 1
          if-no-files-found: error
          overwrite: false

  verify-digests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download all receipts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: receipt-*-${{ github.run_attempt }}
          path: receipts
          merge-multiple: true

      - name: Verify exact receipt set and immutable images
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          EXPECTED_RECEIPTS=4
          mapfile -t RECEIPTS < <(find receipts -type f -name '*.json' -print | sort)
          [ "${#RECEIPTS[@]}" -eq "$EXPECTED_RECEIPTS" ] || {
            echo "Expected exactly four digest receipts, found ${#RECEIPTS[@]}" >&2
            exit 1
          }
          jq -s -e --arg sha "$SOURCE_SHA" '
            length == 4 and
            all(.[]; .source_sha == $sha) and
            all(.[]; .digest | test("^sha256:[0-9a-f]{64}$")) and
            ([.[].digest] | unique | length == 4) and
            ([.[] | [.image, .platform]] | unique | length == 4) and
            ([.[] | select(.image == "ghcr.io/aelira-ai/aelira-core-api") | .platform] | sort == ["linux/amd64", "linux/arm64"]) and
            ([.[] | select(.image == "ghcr.io/aelira-ai/aelira-core-dashboard") | .platform] | sort == ["linux/amd64", "linux/arm64"])
          ' "${RECEIPTS[@]}" >/dev/null
          for receipt in "${RECEIPTS[@]}"; do
            image=$(jq -r .image "$receipt")
            digest=$(jq -r .digest "$receipt")
            docker buildx imagetools inspect "$image@$digest" >/dev/null
          done

      - name: Upload verified receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-digest-receipts-${{ github.run_attempt }}
          path: receipts/*.json
          retention-days: 1
          if-no-files-found: error
          overwrite: false

  promote-all-images:
    needs: [build, verify-digests]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download verified receipts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verified-digest-receipts-${{ github.run_attempt }}
          path: receipts

      - name: Promote both images from exact verified digests
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          MINOR="${VERSION%.*}"
          for image_name in aelira-core-api aelira-core-dashboard; do
            image="ghcr.io/aelira-ai/$image_name"
            amd64=$(jq -r --arg image "$image" 'select(.image == $image and .platform == "linux/amd64") | .digest' receipts/*.json)
            arm64=$(jq -r --arg image "$image" 'select(.image == $image and .platform == "linux/arm64") | .digest' receipts/*.json)
            [ -n "$amd64" ] && [ -n "$arm64" ]
            docker buildx imagetools create \
              --tag "$image:${VERSION}" \
              --tag "$image:${MINOR}" \
              --tag "$image:latest" \
              "$image@$amd64" "$image@$arm64"
          done

      - name: Verify promoted indexes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          MINOR="${VERSION%.*}"
          for image_name in aelira-core-api aelira-core-dashboard; do
            image="ghcr.io/aelira-ai/$image_name"
            expected_amd64=$(jq -r --arg image "$image" 'select(.image == $image and .platform == "linux/amd64") | .digest' receipts/*.json)
            expected_arm64=$(jq -r --arg image "$image" 'select(.image == $image and .platform == "linux/arm64") | .digest' receipts/*.json)
            for tag in "$VERSION" "$MINOR" latest; do
              manifest=$(docker buildx imagetools inspect "$image:$tag" --raw)
              jq -e \
                --arg amd64 "$expected_amd64" \
                --arg arm64 "$expected_arm64" '
                  (.manifests | length == 2) and
                  (any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64" and .digest == $amd64)) and
                  (any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64" and .digest == $arm64))
                ' <<<"$manifest" >/dev/null
            done
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.6.1'

      - name: Sign and verify exact version indexes
        env:
          TAG_NAME: ${{ github.ref_name }}
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/publish-docker.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          for image_name in aelira-core-api aelira-core-dashboard; do
            image="ghcr.io/aelira-ai/$image_name"
            VERSION_DIGEST=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest.Digest}}' | jq -r .)
            [[ "$VERSION_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            cosign sign --yes "$image@$VERSION_DIGEST"
            cosign verify "$image@$VERSION_DIGEST" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity "$CERTIFICATE_IDENTITY"
          done
