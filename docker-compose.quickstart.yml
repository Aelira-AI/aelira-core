# Aelira Core — Zero-Config Quickstart
#
# Get running in under 2 minutes with no .env file needed:
#
#   docker compose -f docker-compose.quickstart.yml up -d
#
# Then visit:
#   API:       http://localhost:8000/docs
#
# To add AI remediation (optional, requires 8GB+ RAM):
#   docker compose -f docker-compose.quickstart.yml --profile ollama up -d
#   docker exec aelira-ollama ollama pull gemma3:4b
#   docker exec aelira-ollama ollama pull nomic-embed-text
#
# nomic-embed-text powers the WCAG knowledge-base retrieval that grounds
# issue explanations with correct criteria citations. API startup seeds the
# bundled corpus and embeds it when this model is available. Severity scoring
# is deterministic and needs no model; without the embedding model the API
# logs one actionable warning and explanations fall back to ungrounded text.
#
# WARNING: This config uses insecure defaults. Do NOT use in production.
# For production, use docker-compose.prod.yml with a configured .env file.

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    container_name: aelira-postgres
    environment:
      POSTGRES_DB: aelira
      POSTGRES_USER: aelira
      POSTGRES_PASSWORD: aelira
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aelira -d aelira"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aelira-network

  redis:
    image: redis:7.4-alpine
    container_name: aelira-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aelira-network

  ollama:
    image: ollama/ollama:latest
    container_name: aelira-ollama
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aelira-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: aelira-api
    ports:
      - "8000:8000"
    environment: &api-environment
      DATABASE_URL: postgresql://aelira:aelira@postgres:5432/aelira
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: quickstart-insecure-change-me
      ENV: development
      ALLOW_MOCK_AUTH: "true"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      DEBUG: "true"
      LOG_LEVEL: info
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-none}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-gemma3:4b}
      OLLAMA_CODE_MODEL: ${OLLAMA_CODE_MODEL:-qwen2.5-coder:7b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-2.5-flash}
      GEMINI_CODE_MODEL: ${GEMINI_CODE_MODEL:-gemini-2.5-flash}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4o-mini}
      OPENAI_CODE_MODEL: ${OPENAI_CODE_MODEL:-gpt-4o}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_TEXT_MODEL: ${ANTHROPIC_TEXT_MODEL:-claude-3-5-sonnet-20241022}
      ANTHROPIC_CODE_MODEL: ${ANTHROPIC_CODE_MODEL:-claude-3-5-sonnet-20241022}
      ANTHROPIC_VISION_MODEL: ${ANTHROPIC_VISION_MODEL:-claude-3-5-sonnet-20241022}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_TEXT_MODEL: ${XAI_TEXT_MODEL:-grok-2}
      XAI_CODE_MODEL: ${XAI_CODE_MODEL:-grok-2}
      XAI_VISION_MODEL: ${XAI_VISION_MODEL:-grok-2-vision}
      REMEDIATION_ARTIFACT_DIR: /app/uploads/remediation-artifacts
      REMEDIATION_ARTIFACT_APPROVED_RETENTION_DAYS: ${REMEDIATION_ARTIFACT_APPROVED_RETENTION_DAYS:-30}
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload --no-proxy-headers"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - aelira-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      <<: *api-environment
      JOB_WORKER_MAX_CONCURRENCY: ${JOB_WORKER_MAX_CONCURRENCY:-1}
      JOB_WORKER_MAX_EXECUTION_SECONDS: ${JOB_WORKER_MAX_EXECUTION_SECONDS:-3600}
      SKIP_MIGRATIONS: "true"
    cpus: ${JOB_WORKER_CPUS:-0.75}
    mem_limit: ${JOB_WORKER_MEMORY_LIMIT:-4g}
    pids_limit: ${JOB_WORKER_PIDS_LIMIT:-512}
    stop_grace_period: ${JOB_WORKER_STOP_GRACE_PERIOD:-65m}
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - upload_data:/app/uploads
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m src.jobs.worker
    healthcheck:
      test: ["CMD", "python", "-m", "src.jobs.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - aelira-network

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  upload_data:

networks:
  aelira-network:
    driver: bridge
