# Aelira Core — Zero-Config Quickstart
#
# Get running in under 2 minutes with no .env file needed:
#
#   docker compose -f docker-compose.quickstart.yml up -d
#
# Then visit:
#   API:       http://localhost:8000/docs
#
# To add AI remediation (optional, requires 8GB+ RAM):
#   docker compose -f docker-compose.quickstart.yml --profile ollama up -d
#   docker exec aelira-ollama ollama pull gemma3:4b
#   docker exec aelira-ollama ollama pull nomic-embed-text
#   docker exec aelira-api python scripts/seed_wcag_guidelines.py
#   docker exec aelira-api python scripts/generate_wcag_embeddings.py
#
# nomic-embed-text powers the WCAG knowledge-base retrieval that grounds
# issue explanations with correct criteria citations. Severity scoring is
# deterministic and needs no model; without the embedding model the API
# logs a warning and explanations fall back to ungrounded text.
#
# WARNING: This config uses insecure defaults. Do NOT use in production.
# For production, use docker-compose.prod.yml with a configured .env file.

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    container_name: aelira-postgres
    environment:
      POSTGRES_DB: aelira
      POSTGRES_USER: aelira
      POSTGRES_PASSWORD: aelira
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aelira -d aelira"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aelira-network

  redis:
    image: redis:7.4-alpine
    container_name: aelira-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aelira-network

  ollama:
    image: ollama/ollama:latest
    container_name: aelira-ollama
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aelira-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: aelira-api
    ports:
      - "8000:8000"
    environment: &api-environment
      DATABASE_URL: postgresql://aelira:aelira@postgres:5432/aelira
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: quickstart-insecure-change-me
      ENV: development
      ALLOW_MOCK_AUTH: "true"
      DEBUG: "true"
      LOG_LEVEL: info
      LLM_FALLBACK_PROVIDER: none
      OLLAMA_HOST: http://ollama:11434
      REMEDIATION_ARTIFACT_DIR: /app/uploads/remediation-artifacts
      REMEDIATION_ARTIFACT_APPROVED_RETENTION_DAYS: ${REMEDIATION_ARTIFACT_APPROVED_RETENTION_DAYS:-30}
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - aelira-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: aelira-worker
    environment:
      <<: *api-environment
      JOB_WORKER_ID: aelira-worker
      JOB_WORKER_MAX_CONCURRENCY: ${JOB_WORKER_MAX_CONCURRENCY:-4}
      SKIP_MIGRATIONS: "true"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - upload_data:/app/uploads
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m src.jobs.worker
    healthcheck:
      test: ["CMD", "python", "-m", "src.jobs.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - aelira-network

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  upload_data:

networks:
  aelira-network:
    driver: bridge
