# Nginx Configuration for Aelira Backend
# Reverse proxy with TLS and rate limiting; API responses are never cached

events {
    worker_connections 1024;
}

http {
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;

    # Upstream backend
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    # HTTP Server (redirect to HTTPS)
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl http2;
        server_name api.example.com;

        # SSL Configuration (update paths after getting certificates)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Client body size (for file uploads)
        client_max_body_size 100M;

        # Shared proxy settings apply to every HTTPS route. Keep the original
        # URI: most routers start at /education, /auth, etc.; some use /api.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Includes authenticated API responses and gated documentation/schema.
        proxy_cache off;

        # Exact probe paths only; dependency readiness status passes through.
        location ~ ^/(health|api/health|live|ready)$ {
            proxy_pass http://api_backend;
        }

        # Multipart upload routes from src/api/education, including image,
        # document, source-code, LaTeX and multimedia uploads. The optional
        # slash preserves FastAPI's own canonical-path redirect behavior.
        location ~ ^/education/((pdf|powerpoint|word|excel|code)/scan|latex/(scan|convert)|multimedia/(scan|transcribe)|image/(alt-text|batch-alt-text|validate-alt-text|score-alt-text|detect-type|describe-chart|analyze-comprehensive))/?$ {
            limit_req zone=upload_limit burst=5 nodelay;
            proxy_pass http://api_backend;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # All current and future API routers retain their native paths. Do not
        # add a URI suffix to proxy_pass or strip a presumed /api prefix.
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_backend;
        }
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
