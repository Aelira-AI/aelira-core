changelog_date Thu, 05 Nov 2026 12:00:00 +0000
disclosure docs/security/debian-backports-0.13.0.md
# Authenticated through Debian's signed trixie InRelease and Sources index.
dsc zlib_1.3.dfsg+really1.3.1-1.dsc ede2791e29c1d3b422f9208bdd7edf040c20445ea1e7453a72037576e64fa197
input zlib_1.3.dfsg+really1.3.1.orig.tar.gz 60dd315c07f616887caa029408308a018ace66e3d142726a97db164b3b8f69fb
input zlib_1.3.dfsg+really1.3.1-1.debian.tar.xz 9ed525955ce9fb0c1b39be8ff98f73450dbfc6305a9a27e6149c8972d38a0a9e
# Upstream commit df84af25dc1942490e1d1c899a07619152a46148 (madler/zlib, the
# 1.4 line) does not apply to 1.3.1; this is the same fix adapted to the
# direct-write loop in gzwrite.c.
patch CVE-2026-76844.patch 98ca233ecee6c954ab279454c5704d31e5e3969a4f829dd7a4fb17cdd3548d17 0 CVE-2026-76844
assert CVE-2026-76844 gzwrite.c CVE-2026-76844: drop the caller's buffer
