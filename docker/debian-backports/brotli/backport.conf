# Debian trixie brotli with the upstream brotli 1.1.1 security fix.
# Format: docker/debian-backports/build-backport.sh. One directive per line.
source brotli
source_version 1.1.0-2
# Debian's installed binaries are the binNMU 1.1.0-2+b7 on both
# architectures, so the rebuild keeps +b7 to sort above them. A Debian
# security update (+deb13uN) still sorts above the rebuild.
rebuilt_version 1.1.0-2+b7+aelira1
changelog_date Fri, 23 Oct 2026 00:00:00 +0000
disclosure docs/security/debian-backports-0.9.14.md
# Authenticated through Debian's signed trixie InRelease and Sources index.
dsc brotli_1.1.0-2.dsc 39b06802a852629132d549a7f7449dee7f435e801706714a4bc2ea2f15b28f36
input brotli_1.1.0.orig.tar.gz 10973f4b4199eafa1d5735ef661ddb2ec2f97319ee9fd1824d4aabe08cff5265
input brotli_1.1.0-2.debian.tar.xz 3d913a3740bcad9a294007575a6beb1846beadbd62b44fb2bf9fdaeddea3236f
# Upstream commit from https://github.com/google/brotli, in the v1.1.1
# release (cherry-pick of 0ed4268a4401abcb4472096340477cf4af7d1a2b).
patch da9806362874b9bd4b552a3af360b5d6347beb12.patch 3c1e4587947e4c61dd9c7c4619b1ae12d6bedbfd3c33c23981bf31269e18d52c 0 CVE-2026-111497
# Run brotli's own build-time test suite on the rebuilt library.
tests
# Two builds must produce identical packages (see build-backport.sh).
reproducible
profile nopython
build arch
binary libbrotli1
binary libbrotli-dev
binary brotli
library libbrotli1 libbrotlicommon.so.1.1.0
library libbrotli1 libbrotlidec.so.1.1.0
library libbrotli1 libbrotlienc.so.1.1.0
runtime libbrotli1
dev libbrotli1
