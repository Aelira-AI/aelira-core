# Disposable stack for the browser user-journey suite. Local use only; CI starts
# the same services natively (see the user-journeys job). Synthetic secrets are
# supplied by the caller, nothing here is a production value.
#
#   docker build -t aelira-journeys-api .          # or any candidate API image
#   export JOURNEY_API_IMAGE=aelira-journeys-api
#   docker compose -p aelira-journeys -f tests/journeys/stack.compose.yml up -d --wait
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: journeys
      POSTGRES_USER: aelira
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U aelira -d journeys']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:latest
    ports: ['127.0.0.1:${JOURNEY_MAIL_PORT:-18325}:8025']
    networks: [default, browser]
  fixture-site:
    # Static site on a globally routable address inside this stack's own network.
    # The product refuses to scan private and loopback targets, so the controlled
    # site needs an address the guard classifies as public. Nothing leaves the host.
    image: ${JOURNEY_API_IMAGE:?Set JOURNEY_API_IMAGE to the candidate API image}
    working_dir: /site
    entrypoint: [python, -m, http.server, '8080', --bind, 0.0.0.0]
    volumes: ['./site:/site:ro']
    healthcheck: {disable: true}
    networks:
      fixture:
        ipv4_address: 11.99.0.10
  api:
    image: ${JOURNEY_API_IMAGE:?Set JOURNEY_API_IMAGE to the candidate API image}
    ports: ['127.0.0.1:${JOURNEY_API_PORT:-18300}:8000']
    networks: [default, browser, fixture]
    environment: &environment
      ENV: production
      DEBUG: 'false'
      ALLOW_MOCK_AUTH: 'false'
      DATABASE_URL: postgresql://aelira@postgres:5432/journeys
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JOURNEY_JWT_SECRET:?Generate a disposable test secret}
      TOKEN_ENCRYPTION_KEY: ${JOURNEY_ENCRYPTION_KEY:?Generate a disposable test key}
      SESSION_REPLAY_ENCRYPTION_KEY: ${JOURNEY_REPLAY_KEY:?Generate a disposable replay key}
      LLM_PROVIDER: none
      LLM_FALLBACK_PROVIDER: none
      EMBEDDING_PROVIDER: none
      OPEN_SIGNUP: 'false'
      DEFAULT_DEPARTMENT_TIER: department
      PUBLIC_API_URL: http://localhost:${JOURNEY_API_PORT:-18300}
      PUBLIC_DASHBOARD_URL: http://localhost:${JOURNEY_DASHBOARD_PORT:-15373}
      PUBLIC_WEBSITE_URL: http://localhost:${JOURNEY_DASHBOARD_PORT:-15373}
      MAGIC_LINK_BASE_URL: http://localhost:${JOURNEY_DASHBOARD_PORT:-15373}
      DASHBOARD_URL: http://localhost:${JOURNEY_DASHBOARD_PORT:-15373}
      CORS_ORIGINS: http://localhost:${JOURNEY_DASHBOARD_PORT:-15373}
      SESSION_COOKIE_SECURE: 'false'
      CSRF_COOKIE_SECURE: 'false'
      SESSION_COOKIE_DOMAIN: ''
      CSRF_COOKIE_DOMAIN: ''
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      FROM_EMAIL: noreply@example.org
      MARKETING_EMAIL_ENABLED: 'false'
      REMEDIATION_ARTIFACT_DIR: /app/uploads/remediation-artifacts
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    volumes: &mounts
      - ../../src:/app/src:ro
      - ../../alembic:/app/alembic:ro
      - ../../alembic.ini:/app/alembic.ini:ro
      - ../../entrypoint.sh:/app/entrypoint.sh:ro
      - uploads:/app/uploads
      - whisper-cache:/models/hf:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: [uvicorn, 'src.api.main:app', --host, 0.0.0.0, --port, '8000', --no-proxy-headers]
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:8000/ready']
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    image: ${JOURNEY_API_IMAGE:?Set JOURNEY_API_IMAGE to the candidate API image}
    networks: [default, fixture]
    environment:
      <<: *environment
      SKIP_MIGRATIONS: 'true'
      JOB_WORKER_ID: journeys
      JOB_WORKER_MAX_CONCURRENCY: '2'
    volumes: *mounts
    command: [python, -m, src.jobs.worker]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, src.jobs.healthcheck, --mode, readiness]
      interval: 10s
      timeout: 5s
      retries: 20
networks:
  default:
    internal: true
  browser:
    driver: bridge
  fixture:
    driver: bridge
    internal: true
    ipam:
      config: [{subnet: 11.99.0.0/24}]
volumes:
  uploads:
  whisper-cache:
    external: true
    name: aelira-journeys-whisper
