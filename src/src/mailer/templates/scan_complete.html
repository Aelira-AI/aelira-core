<!-- Success Icon -->
<div style="text-align: center; margin-bottom: 16px;">
    <div style="width: 64px; height: 64px; background-color: #dcfce7; border-radius: 50%;
                display: inline-flex; align-items: center; justify-content: center; margin: 0 auto;">
        <span style="font-size: 32px;">&#10003;</span>
    </div>
</div>

<h2 style="color: #1a1a2e; text-align: center; margin: 0 0 24px 0;">{{title}}</h2>

<!-- Content -->
<div style="line-height: 1.6;">
    {{message}}
</div>

<!-- Action Button -->
<div style="text-align: center; margin-top: 24px;">
    <a href="{{action_url}}"
       style="background-color: #7C3AED; background: linear-gradient(135deg, #8B5CF6 0%, #6366F1 100%); color: white; padding: 14px 28px;
              text-decoration: none; border-radius: 8px; display: inline-block;
              font-weight: 600; font-size: 16px;">
        {{action_text}}
    </a>
</div>
