# Aelira Core — production self-hosting
#
#   cp .env.example .env    # set the REQUIRED section at minimum
#   docker compose -f docker-compose.prod.yml up -d
#
# With fully local AI (documents never leave this host):
#   LLM_PROVIDER=ollama EMBEDDING_PROVIDER=ollama docker compose -f docker-compose.prod.yml --profile ollama up -d
#   docker exec aelira-ollama ollama pull qwen2.5vl:3b && ollama pull gemma3:4b && ollama pull qwen2.5-coder:7b && ollama pull nomic-embed-text
#
# What this file deliberately does NOT do:
#   - TLS termination. Put your reverse proxy (nginx, Traefik, Caddy) in
#     front of api (8000) and dashboard (8080), and set PUBLIC_API_URL /
#     PUBLIC_DASHBOARD_URL / CORS_ORIGINS in .env to the public hostnames.
#   - Horizontal API scaling. This file runs one API service with a configurable
#     worker count; add replicas through your orchestrator when needed.
#
# Images are promoted from verified immutable platform digests; pin a version tag rather
# than tracking latest in real deployments. To build locally instead:
#   docker compose -f docker-compose.prod.yml build

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    container_name: aelira-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aelira}
      POSTGRES_USER: ${POSTGRES_USER:-aelira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aelira} -d ${POSTGRES_DB:-aelira}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: aelira-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/aelira-ai/aelira-core-api:${AELIRA_VERSION:-0.9.6}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aelira-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment: &api-environment
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-aelira}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aelira}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSION_REFRESH_GRACE_SECONDS: ${SESSION_REFRESH_GRACE_SECONDS:-10}
      SESSION_REPLAY_ENCRYPTION_KEY: ${SESSION_REPLAY_ENCRYPTION_KEY:?set SESSION_REPLAY_ENCRYPTION_KEY in .env}
      # Open-core makes no implicit provider choice. Set one in .env or on the command line.
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-none}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-gemma3:4b}
      OLLAMA_CODE_MODEL: ${OLLAMA_CODE_MODEL:-qwen2.5-coder:7b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      REPORT_ARTIFACT_DIR: ${REPORT_ARTIFACT_DIR:-/app/uploads/report-artifacts}
      REPORT_ARTIFACT_MAX_BYTES: ${REPORT_ARTIFACT_MAX_BYTES:-20971520}
    ports:
      - "${API_BIND:-127.0.0.1:8000}:8000"
    volumes:
      - upload_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  worker:
    image: ghcr.io/aelira-ai/aelira-core-api:${AELIRA_VERSION:-0.9.6}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment:
      <<: *api-environment
      JOB_WORKER_MAX_CONCURRENCY: ${JOB_WORKER_MAX_CONCURRENCY:-1}
      JOB_WORKER_MAX_EXECUTION_SECONDS: ${JOB_WORKER_MAX_EXECUTION_SECONDS:-3600}
      SKIP_MIGRATIONS: "true"
    cpus: ${JOB_WORKER_CPUS:-0.75}
    mem_limit: ${JOB_WORKER_MEMORY_LIMIT:-4g}
    pids_limit: ${JOB_WORKER_PIDS_LIMIT:-512}
    stop_grace_period: ${JOB_WORKER_STOP_GRACE_PERIOD:-65m}
    volumes:
      - upload_data:/app/uploads
    command: ["python", "-m", "src.jobs.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "src.jobs.healthcheck", "--mode", "readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dashboard:
    image: ghcr.io/aelira-ai/aelira-core-dashboard:${AELIRA_VERSION:-0.9.6}
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: aelira-dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1:8080}:80"

  ollama:
    image: ollama/ollama:latest
    container_name: aelira-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment for NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  postgres_data:
  redis_data:
  upload_data:
  ollama_data:
