[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=src
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-report=xml:coverage.xml
    --cov-fail-under=25
markers =
    unit: Unit tests
    integration: Integration tests (require external services - skipped in CI)
    slow: Slow running tests
    requires_api: Tests that require external API services
    requires_db: Tests that require database access
    load: Load/performance tests (run separately)
    browser: Browser compatibility tests (require Playwright and running dashboard)
    e2e: End-to-end tests (require full environment - skipped in CI)

