[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aelira-core"
version = "0.9.6"
description = "Self-hostable accessibility compliance platform for higher education: scan, score, and remediate PDF, Office, LaTeX, web, and multimedia content against WCAG 2.1 AA."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
keywords = [
  "accessibility",
  "wcag",
  "a11y",
  "ada-compliance",
  "higher-education",
  "pdf-remediation",
  "document-accessibility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Education",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Adaptive Technologies",
]
# The full pinned dependency set lives in requirements.txt (the deployment
# lockfile); docs/DEPENDENCIES.md explains what each major dependency does.
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://aelira.ai"
Repository = "https://github.com/Aelira-AI/aelira-core"
Issues = "https://github.com/Aelira-AI/aelira-core/issues"
Changelog = "https://github.com/Aelira-AI/aelira-core/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = { find = { include = ["src*"] } }

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
